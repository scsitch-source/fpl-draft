<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Draft League Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root{
    --turf: #0E3B2E;
    --turf-deep: #0A2C22;
    --ink: #0A100D;
    --card: #123B2F;
    --line: #33564A;
    --chalk: #F2EFE4;
    --chalk-dim: #B9C9C0;
    --amber: #F4B400;
    --amber-dim: #8A6A16;
    --loss: #C1443B;
    --draw: #7C8B84;
    --win: #3FA772;
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(244,180,0,0.07), transparent 60%),
      linear-gradient(180deg, var(--turf) 0%, var(--turf-deep) 100%);
    color:var(--chalk);
    font-family:'Inter', system-ui, sans-serif;
    min-height:100vh;
    padding-bottom:60px;
  }
  .wrap{max-width:1100px;margin:0 auto;padding:0 20px;}

  /* ---------- Hero scoreboard ---------- */
  .hero{
    border-bottom:1px solid var(--line);
    padding:28px 0 22px;
    margin-bottom:32px;
  }
  .hero-top{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:16px;}
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--amber);
    margin:0 0 6px;
  }
  h1{
    font-family:'Teko', sans-serif;
    font-weight:700;
    font-size:56px;
    line-height:0.95;
    letter-spacing:0.01em;
    margin:0;
    color:var(--chalk);
  }
  .gw-badge{
    font-family:'IBM Plex Mono', monospace;
    background:var(--ink);
    border:1px solid var(--amber-dim);
    border-radius:var(--radius);
    padding:10px 18px;
    text-align:right;
    min-width:180px;
  }
  .gw-badge .label{font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--chalk-dim);}
  .gw-badge .value{
    font-size:26px;font-weight:600;color:var(--amber);
    text-shadow:0 0 12px rgba(244,180,0,0.35);
  }
  .gw-badge .sub{font-size:12px;color:var(--chalk-dim);margin-top:2px;}

  /* ---------- Layout grid ---------- */
  .grid{display:grid;grid-template-columns:1.7fr 1fr;gap:24px;margin-bottom:32px;}
  @media (max-width:840px){ .grid{grid-template-columns:1fr;} }

  .panel{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px;
  }
  .panel h2{
    font-family:'Teko', sans-serif;
    font-weight:600;
    font-size:26px;
    letter-spacing:0.02em;
    margin:0 0 14px;
    color:var(--chalk);
    display:flex;align-items:center;gap:10px;
  }
  .panel h2 .dot{width:8px;height:8px;border-radius:50%;background:var(--amber);}

  /* ---------- Standings table ---------- */
  table{width:100%;border-collapse:collapse;}
  thead th{
    text-align:left;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--chalk-dim);
    padding:0 8px 10px;
    border-bottom:1px solid var(--line);
  }
  tbody td{
    padding:10px 8px;
    border-bottom:1px solid rgba(255,255,255,0.05);
    font-size:14px;
    vertical-align:middle;
  }
  tbody tr.you{background:rgba(244,180,0,0.08);}
  tbody tr.you td:first-child{box-shadow: inset 3px 0 0 var(--amber);}
  .rank{font-family:'IBM Plex Mono', monospace;color:var(--chalk-dim);width:26px;}
  .team-cell .name{font-weight:600;}
  .team-cell .manager{font-size:12px;color:var(--chalk-dim);}
  .num{
    font-family:'IBM Plex Mono', monospace;
    font-variant-numeric:tabular-nums;
    text-align:right;
  }
  .pts{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    color:var(--amber);
    text-shadow:0 0 8px rgba(244,180,0,0.25);
    text-align:right;
  }
  .form{display:flex;gap:3px;justify-content:flex-end;}
  .chip{
    width:18px;height:18px;border-radius:4px;
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;font-weight:600;
    display:flex;align-items:center;justify-content:center;
    color:var(--ink);
  }
  .chip.W{background:var(--win);}
  .chip.D{background:var(--draw);color:var(--chalk);}
  .chip.L{background:var(--loss);}

  /* ---------- Your team spotlight ---------- */
  .spot-rank{font-family:'Teko';font-size:54px;color:var(--amber);line-height:1;text-shadow:0 0 16px rgba(244,180,0,0.3);}
  .spot-name{font-weight:700;font-size:18px;margin-top:4px;}
  .spot-manager{color:var(--chalk-dim);font-size:13px;margin-bottom:14px;}
  .spot-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0;}
  .stat-box{background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 6px;text-align:center;}
  .stat-box .v{font-family:'IBM Plex Mono';font-size:18px;color:var(--amber);}
  .stat-box .l{font-size:10px;color:var(--chalk-dim);text-transform:uppercase;letter-spacing:0.06em;margin-top:2px;}
  .next-fixture{
    border-top:1px solid var(--line);
    margin-top:14px;padding-top:14px;
    font-size:13px;
  }
  .next-fixture .vs{font-family:'Teko';font-size:22px;margin:4px 0;}

  /* ---------- Fixtures ---------- */
  .gw-pills{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;padding-bottom:4px;}
  .gw-pill{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    padding:6px 12px;
    border-radius:20px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--chalk-dim);
    cursor:pointer;
    white-space:nowrap;
  }
  .gw-pill.active{background:var(--amber);border-color:var(--amber);color:var(--ink);font-weight:600;}
  .fixture-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;}
  .fixture-card{
    background:var(--ink);border:1px solid var(--line);border-radius:8px;
    padding:12px 14px;
  }
  .fixture-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;}
  .fixture-row .side{font-size:13px;}
  .fixture-row .side .m{display:block;font-size:11px;color:var(--chalk-dim);}
  .fixture-row .score{
    font-family:'IBM Plex Mono';font-size:18px;font-weight:600;
    min-width:28px;text-align:center;
  }
  .fixture-row.winner .score{color:var(--amber);text-shadow:0 0 8px rgba(244,180,0,0.3);}
  .fixture-card .status{font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:var(--chalk-dim);margin-top:6px;}

  /* ---------- Chart ---------- */
  .chart-wrap{height:340px;}

  footer{
    max-width:1100px;margin:40px auto 0;padding:0 20px;
    font-size:12px;color:var(--chalk-dim);
    display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;
    border-top:1px solid var(--line);padding-top:16px;
  }
  .state-msg{padding:60px 20px;text-align:center;color:var(--chalk-dim);font-family:'IBM Plex Mono';}
  a{color:var(--amber);}
</style>
</head>
<body>

<div class="wrap">
  <div class="hero">
    <div class="hero-top">
      <div>
        <p class="eyebrow" id="scoring-format">Head-to-head draft league</p>
        <h1 id="league-name">Loading league…</h1>
      </div>
      <div class="gw-badge">
        <div class="label">Gameweek</div>
        <div class="value" id="gw-value">–</div>
        <div class="sub" id="gw-sub">–</div>
      </div>
    </div>
  </div>

  <div id="app">
    <div class="state-msg">Fetching data/league.json…</div>
  </div>
</div>

<footer>
  <span id="last-updated">–</span>
  <span>Unofficial dashboard · data via the public FPL Draft API · not affiliated with the Premier League</span>
</footer>

<script>
const DATA_URL = 'data/league.json';

function formatDate(iso){
  if(!iso) return '–';
  try{
    const d = new Date(iso);
    return d.toLocaleString(undefined, { weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
  }catch(e){ return iso; }
}

function formChips(form){
  if(!form || !form.length) return '<span style="color:var(--chalk-dim);font-size:12px;">–</span>';
  return '<div class="form">' + form.map(r => `<div class="chip ${r}">${r}</div>`).join('') + '</div>';
}

function render(data){
  document.getElementById('league-name').textContent = data.league.name || 'Draft League';
  document.getElementById('scoring-format').textContent =
    data.league.scoring === 'c' ? 'Classic scoring draft league' : 'Head-to-head draft league';
  document.getElementById('gw-value').textContent = data.current_event ? 'GW ' + data.current_event : '–';
  document.getElementById('gw-sub').textContent = data.next_deadline
    ? 'Next deadline ' + formatDate(data.next_deadline)
    : '';
  document.getElementById('last-updated').textContent = 'Last updated ' + formatDate(data.generated_at);

  const app = document.getElementById('app');
  app.innerHTML = '';

  const grid = document.createElement('div');
  grid.className = 'grid';
  grid.appendChild(buildStandingsPanel(data));
  grid.appendChild(buildSpotlightPanel(data));
  app.appendChild(grid);

  app.appendChild(buildFixturesPanel(data));
  app.appendChild(buildProgressionPanel(data));
}

function buildStandingsPanel(data){
  const panel = document.createElement('div');
  panel.className = 'panel';
  panel.innerHTML = `<h2><span class="dot"></span>Standings</h2>`;

  const table = document.createElement('table');
  table.innerHTML = `
    <thead>
      <tr>
        <th></th><th>Team</th><th class="num">P</th><th class="num">W</th><th class="num">D</th>
        <th class="num">L</th><th class="num">PF</th><th class="num">PA</th><th class="num">Pts</th>
        <th style="text-align:right;">Form</th>
      </tr>
    </thead>
    <tbody></tbody>
  `;
  const tbody = table.querySelector('tbody');
  data.standings.forEach(row => {
    const tr = document.createElement('tr');
    if(row.is_you) tr.className = 'you';
    tr.innerHTML = `
      <td class="rank">${row.rank ?? '–'}</td>
      <td class="team-cell">
        <div class="name">${row.team_name}</div>
        <div class="manager">${row.manager_name}</div>
      </td>
      <td class="num">${row.played ?? 0}</td>
      <td class="num">${row.won ?? 0}</td>
      <td class="num">${row.drawn ?? 0}</td>
      <td class="num">${row.lost ?? 0}</td>
      <td class="num">${row.points_for ?? 0}</td>
      <td class="num">${row.points_against ?? 0}</td>
      <td class="pts">${row.total ?? 0}</td>
      <td>${formChips(row.form)}</td>
    `;
    tbody.appendChild(tr);
  });
  panel.appendChild(table);
  return panel;
}

function buildSpotlightPanel(data){
  const panel = document.createElement('div');
  panel.className = 'panel';
  const you = data.standings.find(r => r.is_you);

  if(!you){
    panel.innerHTML = `<h2><span class="dot"></span>Your team</h2>
      <p style="color:var(--chalk-dim);font-size:13px;">Set ENTRY_ID in the workflow to spotlight your team here.</p>`;
    return panel;
  }

  let fixtureHtml = '<p style="color:var(--chalk-dim);font-size:13px;">No upcoming fixture found.</p>';
  if(data.your_next_fixture){
    const f = data.your_next_fixture;
    const isHome = f.home.league_entry_id === you.league_entry_id;
    const opp = isHome ? f.away : f.home;
    fixtureHtml = `
      <div class="next-fixture">
        <div style="font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:var(--chalk-dim);">
          ${f.finished ? 'Result' : 'Next up'} · GW ${f.event}
        </div>
        <div class="vs">vs ${opp.team_name}</div>
        <div style="color:var(--chalk-dim);">${opp.manager_name}</div>
      </div>
    `;
  }

  panel.innerHTML = `
    <h2><span class="dot"></span>Your team</h2>
    <div class="spot-rank">#${you.rank ?? '–'}</div>
    <div class="spot-name">${you.team_name}</div>
    <div class="spot-manager">${you.manager_name}</div>
    <div class="spot-stats">
      <div class="stat-box"><div class="v">${you.won}-${you.drawn}-${you.lost}</div><div class="l">W-D-L</div></div>
      <div class="stat-box"><div class="v">${you.points_for}</div><div class="l">Pts For</div></div>
      <div class="stat-box"><div class="v">${you.points_against}</div><div class="l">Pts Against</div></div>
      <div class="stat-box"><div class="v">${you.total}</div><div class="l">League Pts</div></div>
    </div>
    <div style="margin-top:8px;">${formChips(you.form)}</div>
    ${fixtureHtml}
  `;
  return panel;
}

function buildFixturesPanel(data){
  const panel = document.createElement('div');
  panel.className = 'panel';
  panel.style.marginBottom = '24px';
  panel.innerHTML = `<h2><span class="dot"></span>Fixtures &amp; results</h2>`;

  const gwKeys = Object.keys(data.fixtures_by_event).map(Number).sort((a,b) => a-b);
  const pillsWrap = document.createElement('div');
  pillsWrap.className = 'gw-pills';
  const listWrap = document.createElement('div');
  listWrap.className = 'fixture-list';

  function renderGw(gw){
    listWrap.innerHTML = '';
    const fixtures = data.fixtures_by_event[String(gw)] || [];
    fixtures.forEach(f => {
      const homeWin = f.finished && f.home.score > f.away.score;
      const awayWin = f.finished && f.away.score > f.home.score;
      const card = document.createElement('div');
      card.className = 'fixture-card';
      card.innerHTML = `
        <div class="fixture-row ${homeWin ? 'winner' : ''}">
          <div class="side">${f.home.team_name}<span class="m">${f.home.manager_name}</span></div>
          <div class="score">${f.home.score ?? '–'}</div>
        </div>
        <div class="fixture-row ${awayWin ? 'winner' : ''}">
          <div class="side">${f.away.team_name}<span class="m">${f.away.manager_name}</span></div>
          <div class="score">${f.away.score ?? '–'}</div>
        </div>
        <div class="status">${f.finished ? 'Final' : (f.started ? 'Live' : 'Not started')}</div>
      `;
      listWrap.appendChild(card);
    });
  }

  gwKeys.forEach(gw => {
    const pill = document.createElement('button');
    pill.className = 'gw-pill';
    pill.textContent = 'GW ' + gw;
    pill.addEventListener('click', () => {
      pillsWrap.querySelectorAll('.gw-pill').forEach(p => p.classList.remove('active'));
      pill.classList.add('active');
      renderGw(gw);
    });
    pillsWrap.appendChild(pill);
  });

  panel.appendChild(pillsWrap);
  panel.appendChild(listWrap);

  const defaultGw = data.current_event && gwKeys.includes(data.current_event)
    ? data.current_event
    : gwKeys[gwKeys.length - 1];
  const defaultPill = [...pillsWrap.children].find(p => p.textContent === 'GW ' + defaultGw);
  if(defaultPill){ defaultPill.classList.add('active'); }
  if(defaultGw !== undefined) renderGw(defaultGw);

  return panel;
}

function buildProgressionPanel(data){
  const panel = document.createElement('div');
  panel.className = 'panel';
  panel.innerHTML = `<h2><span class="dot"></span>Points progression</h2>
    <div class="chart-wrap"><canvas id="progression-chart"></canvas></div>`;

  requestAnimationFrame(() => {
    const ctx = document.getElementById('progression-chart');
    const events = data.progression.events;
    const teamsObj = data.progression.teams;
    const yourLeId = data.your_league_entry_id;

    const palette = ['#F4B400','#7FB8A0','#C1443B','#8A9BAE','#D9A441','#5C8A75','#B98BC9','#E0806A','#6FA8DC','#C6C6C6'];
    let colorIdx = 0;

    const datasets = Object.entries(teamsObj).map(([leId, t]) => {
      const isYou = String(yourLeId) === String(leId);
      const color = isYou ? '#F4B400' : palette[(colorIdx++) % palette.length];
      return {
        label: t.name,
        data: t.cumulative,
        borderColor: color,
        backgroundColor: color,
        borderWidth: isYou ? 3 : 1.5,
        pointRadius: isYou ? 3 : 0,
        tension: 0.25,
      };
    });

    new Chart(ctx, {
      type: 'line',
      data: { labels: events.map(e => 'GW' + e), datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: 'nearest', intersect: false },
        plugins: {
          legend: { labels: { color: '#B9C9C0', font: { family: 'IBM Plex Mono', size: 11 } } },
        },
        scales: {
          x: { ticks: { color:'#B9C9C0' }, grid: { color:'rgba(255,255,255,0.05)' } },
          y: { ticks: { color:'#B9C9C0' }, grid: { color:'rgba(255,255,255,0.05)' } },
        }
      }
    });
  });

  return panel;
}

fetch(DATA_URL)
  .then(r => {
    if(!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  })
  .then(render)
  .catch(err => {
    document.getElementById('app').innerHTML = `
      <div class="state-msg">
        Couldn't load <code>${DATA_URL}</code> (${err.message}).<br/>
        If you're viewing this locally, serve the folder over HTTP rather than opening the file directly,
        or wait for the "Update league data" GitHub Action to run once on the live site.
      </div>`;
  });
</script>

</body>
</html>
