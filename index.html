<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Draft League Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.47.0/iconfont/tabler-icons.min.css">
<style>.ti{font-family:'tabler-icons';font-style:normal;}</style>
<style>
  :root{
    --bg: #F3F3FB;
    --card: #FFFFFF;
    --ink: #F6F6FC;
    --line: #E6E5F2;
    --chalk: #16152B;
    --chalk-dim: #6C6B87;
    --amber: #00C2A0;
    --amber-dim: #BFEFE5;
    --loss: #E5484D;
    --draw: #A6A5C0;
    --win: #17C08C;
    --radius: 12px;
    --grad-a: #3B1E9E;
    --grad-b: #1C63E8;
    --grad-c: #14D2E0;
    --shadow: 0 1px 2px rgba(20,16,60,0.04), 0 6px 20px rgba(20,16,60,0.06);
  }
  [data-theme="dark"]{
    --bg: #0F0E22;
    --card: #191833;
    --ink: #201F3E;
    --line: #322F58;
    --chalk: #F2F1FA;
    --chalk-dim: #9C9BC0;
    --amber: #2EE6C8;
    --amber-dim: #1B4A44;
    --loss: #FF6B6E;
    --draw: #7A79A0;
    --win: #2EE6A8;
    --grad-a: #241259;
    --grad-b: #123B8E;
    --grad-c: #0C7A86;
    --shadow: 0 1px 2px rgba(0,0,0,0.2), 0 6px 20px rgba(0,0,0,0.3);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--chalk);
    font-family:'Inter', system-ui, sans-serif;
    min-height:100vh;
    padding-bottom:60px;
    transition:background 0.2s ease, color 0.2s ease;
  }
  .wrap{max-width:1100px;margin:0 auto;padding:0 20px;}

  /* ---------- Hero ---------- */
  .hero{
    background:linear-gradient(120deg, var(--grad-a) 0%, var(--grad-b) 55%, var(--grad-c) 100%);
    border-radius:0 0 20px 20px;
    padding:26px 24px 24px;
    margin:0 0 28px;
  }
  .hero-inner{max-width:1060px;margin:0 auto;}
  .hero-top{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:16px;}
  .eyebrow{
    font-size:12px;
    font-weight:700;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:rgba(255,255,255,0.85);
    margin:0 0 4px;
  }
  h1{
    font-family:'Manrope', sans-serif;
    font-weight:800;
    font-size:32px;
    line-height:1.1;
    margin:0;
    color:#FFFFFF;
  }
  .theme-toggle{
    background:rgba(255,255,255,0.16);
    border:1px solid rgba(255,255,255,0.3);
    color:#fff;
    border-radius:20px;
    padding:6px 14px;
    font-size:12px;font-weight:600;
    cursor:pointer;
    display:flex;align-items:center;gap:6px;
  }
  .theme-toggle:hover{background:rgba(255,255,255,0.26);}
  .gw-badge{
    background:rgba(255,255,255,0.14);
    border:1px solid rgba(255,255,255,0.28);
    border-radius:var(--radius);
    padding:10px 18px;
    text-align:right;
    min-width:170px;
  }
  .gw-badge .label{font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.75);}
  .gw-badge .value{font-size:22px;font-weight:800;font-family:'Manrope';color:#fff;}
  .gw-badge .sub{font-size:12px;color:rgba(255,255,255,0.75);margin-top:2px;}
  .gw-badge .countdown{
    font-family:'Manrope';font-weight:700;font-size:15px;color:#fff;
    margin-top:4px;
  }

  /* ---------- Layout grid ---------- */
  .grid{display:grid;grid-template-columns:1.7fr 1fr;gap:20px;margin-bottom:24px;}
  @media (max-width:840px){ .grid{grid-template-columns:1fr;} }

  .panel{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    box-shadow:var(--shadow);
    padding:20px;
  }
  .panel h2{
    font-family:'Manrope', sans-serif;
    font-weight:700;
    font-size:17px;
    margin:0 0 14px;
    color:var(--chalk);
    display:flex;align-items:center;gap:8px;
  }
  .panel h2 .dot{width:8px;height:8px;border-radius:50%;background:var(--amber);}

  /* ---------- Standings table ---------- */
  table{width:100%;border-collapse:collapse;}
  thead th{
    text-align:left;
    font-size:11px;
    font-weight:700;
    letter-spacing:0.05em;
    text-transform:uppercase;
    color:var(--chalk-dim);
    padding:0 8px 10px;
    border-bottom:1px solid var(--line);
  }
  tbody td{
    padding:10px 8px;
    border-bottom:1px solid var(--line);
    font-size:14px;
    vertical-align:middle;
  }
  tbody tr.you{background:var(--amber-dim);}
  tbody tr.you td:first-child{box-shadow: inset 3px 0 0 var(--amber);}
  tbody tr.tier-strong:not(.you){background:rgba(108,60,233,0.10);}
  tbody tr.tier-soft:not(.you){background:rgba(108,60,233,0.04);}
  [data-theme="dark"] tbody tr.tier-strong:not(.you){background:rgba(108,60,233,0.22);}
  [data-theme="dark"] tbody tr.tier-soft:not(.you){background:rgba(108,60,233,0.10);}
  .rank{color:var(--chalk-dim);width:26px;font-weight:600;}
  .team-cell .name{font-weight:700;}
  .team-cell .manager{font-size:12px;color:var(--chalk-dim);}
  .num{
    font-variant-numeric:tabular-nums;
    text-align:right;
  }
  .pts{
    font-weight:800;
    color:var(--amber);
    text-align:right;
  }
  .form{display:flex;gap:3px;justify-content:flex-end;}
  .chip{
    width:18px;height:18px;border-radius:6px;
    font-size:10px;font-weight:700;
    display:flex;align-items:center;justify-content:center;
    color:#fff;
  }
  .chip.W{background:var(--win);}
  .chip.D{background:var(--draw);}
  .chip.L{background:var(--loss);}

  /* ---------- Your team spotlight ---------- */
  .spot-rank{font-family:'Manrope';font-weight:800;font-size:38px;color:var(--amber);line-height:1;}
  .spot-name{font-weight:700;font-size:17px;margin-top:4px;}
  .spot-manager{color:var(--chalk-dim);font-size:13px;margin-bottom:14px;}
  .spot-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0;}
  .stat-box{background:var(--ink);border-radius:10px;padding:8px 6px;text-align:center;}
  .stat-box .v{font-family:'Manrope';font-weight:700;font-size:17px;color:var(--amber);}
  .stat-box .l{font-size:10px;color:var(--chalk-dim);text-transform:uppercase;letter-spacing:0.05em;margin-top:2px;}
  .next-fixture{
    border-top:1px solid var(--line);
    margin-top:14px;padding-top:14px;
    font-size:13px;
  }
  .next-fixture .vs{font-family:'Manrope';font-weight:700;font-size:19px;margin:4px 0;}

  /* ---------- Fixtures ---------- */
  .gw-pills{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;padding-bottom:4px;}
  .gw-pill{
    font-size:12px;font-weight:600;
    padding:6px 14px;
    border-radius:20px;
    border:1px solid var(--line);
    background:var(--ink);
    color:var(--chalk-dim);
    cursor:pointer;
    white-space:nowrap;
  }
  .gw-pill.active{background:var(--amber);border-color:var(--amber);color:#fff;}
  .fixture-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;}
  .fixture-card{
    background:var(--ink);border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;
  }
  .fixture-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;}
  .fixture-row .side{font-size:13px;}
  .ha-tag{
    display:inline-block;width:16px;height:16px;line-height:16px;text-align:center;
    font-size:9px;font-weight:700;border-radius:4px;background:var(--ink);color:var(--chalk-dim);
    margin-right:6px;vertical-align:middle;
  }
  .fixture-row .side .m{display:block;font-size:11px;color:var(--chalk-dim);}
  .fixture-row .score{
    font-family:'Manrope';font-size:17px;font-weight:700;
    min-width:28px;text-align:center;
  }
  .fixture-row.winner .score{color:var(--amber);}
  .fixture-card .status{font-size:10px;text-transform:uppercase;letter-spacing:0.06em;color:var(--chalk-dim);margin-top:6px;}

  /* ---------- Squad expand ---------- */
  .expand-btn{
    background:none;border:none;color:var(--amber);font-size:11px;font-weight:700;
    cursor:pointer;padding:2px 0;
  }
  .squad-expand{display:none;margin-top:10px;}
  .squad-expand.open{display:block;}
  .squad-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:14px;
    border-top:1px solid var(--line);padding-top:10px;
  }
  @media (max-width:520px){ .squad-grid{grid-template-columns:1fr;} }
  .squad-col-label{font-size:11px;font-weight:700;color:var(--chalk-dim);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.04em;}
  .squad-bench-label{font-size:10px;font-weight:700;color:var(--chalk-dim);margin:8px 0 4px;text-transform:uppercase;}
  .squad-row{
    display:grid;grid-template-columns:32px 1fr auto 30px;align-items:center;gap:6px;
    font-size:12.5px;padding:3px 6px;border-radius:4px;
  }
  .squad-pos{font-size:10px;font-weight:700;color:var(--chalk-dim);}
  .squad-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cap-badge{
    display:inline-block;margin-left:5px;font-size:9px;font-weight:700;
    background:var(--amber);color:#fff;border-radius:4px;padding:0 4px;vertical-align:middle;
  }
  .cap-badge.vc{background:var(--draw);}
  .cap-badge.sub-badge{background:var(--win);}
  .cap-badge.sub-badge.out{background:var(--chalk-dim);}
  .squad-icons{display:flex;gap:4px;white-space:nowrap;}
  .stat-icon{font-size:12px;}
  .squad-pts{font-weight:700;text-align:right;color:var(--amber);}
  .squad-played-count{font-size:10px;font-weight:600;color:var(--chalk-dim);text-transform:none;letter-spacing:0;margin-left:4px;}

  /* ---------- Chart ---------- */
  .chart-wrap{height:340px;}

  /* ---------- Tabs ---------- */
  .tabs{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap;}
  .tab-btn{
    background:var(--card);border:1px solid var(--line);cursor:pointer;
    padding:8px 16px;
    border-radius:20px;
    font-size:13px;font-weight:600;
    color:var(--chalk-dim);
  }
  .tab-btn.active{color:#fff;background:var(--amber);border-color:var(--amber);}
  .tab-panel{display:none;}
  .tab-panel.active{display:block;}

  /* ---------- Bracket ---------- */
  .bracket-round-label{
    font-size:11px;font-weight:700;text-transform:uppercase;
    letter-spacing:0.06em;color:var(--chalk-dim);margin:18px 0 8px;
  }
  .bracket-round-label:first-child{margin-top:0;}
  .bye-note{font-size:12px;color:var(--win);margin-top:4px;font-weight:600;}
  .champion-banner{
    margin-top:14px;padding:14px 16px;
    background:var(--amber-dim);
    border-radius:12px;
    font-family:'Manrope';font-weight:700;font-size:17px;color:var(--amber);
    display:flex;align-items:center;gap:8px;
  }

  /* ---------- Golden GW ---------- */
  .golden-leader{
    padding:14px 18px;background:var(--amber-dim);
    border-radius:12px;margin-bottom:16px;
  }
  .golden-leader .label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--chalk-dim);}
  .golden-leader .value{font-family:'Manrope';font-weight:700;font-size:19px;color:var(--amber);}

  /* ---------- Waivers ---------- */
  .waiver-input-row{display:flex;gap:8px;margin-bottom:14px;}
  .waiver-input-row input{
    flex:1;background:var(--ink);border:1px solid var(--line);border-radius:8px;
    color:var(--chalk);padding:9px 12px;font-family:'Inter';font-size:13px;
  }
  .waiver-input-row button, .gw-pill.add-btn{
    background:var(--amber);color:#fff;border:none;border-radius:8px;
    padding:9px 18px;font-weight:700;font-size:13px;cursor:pointer;
  }
  .waiver-item{
    display:flex;justify-content:space-between;gap:12px;
    padding:10px 0;border-top:1px solid var(--line);font-size:13px;
  }
  .waiver-item .date{color:var(--chalk-dim);font-size:11px;white-space:nowrap;}
  .waiver-item .del{background:none;border:none;color:var(--loss);cursor:pointer;font-size:12px;font-weight:600;}

  footer{
    max-width:1100px;margin:40px auto 0;padding:0 20px;
    font-size:12px;color:var(--chalk-dim);
    display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;
    border-top:1px solid var(--line);padding-top:16px;
  }
  .state-msg{padding:60px 20px;text-align:center;color:var(--chalk-dim);}
  a{color:var(--amber);}

  /* ---------- View-as bar ---------- */
  .view-as-bar{
    display:flex;align-items:center;gap:10px;margin-bottom:18px;
    font-size:13px;color:var(--chalk-dim);
  }
  .view-as-bar select{
    background:var(--card);border:1px solid var(--line);border-radius:8px;
    color:var(--chalk);padding:6px 10px;font-size:13px;font-family:'Inter';
  }

  /* ---------- Streaks ---------- */
  .streak-row{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line);}
  .streak-row:first-of-type{border-top:none;}
  .streak-icon{font-size:22px;}
  .streak-name{font-weight:700;font-size:14px;}
  .streak-sub{font-size:12px;color:var(--chalk-dim);}

  /* ---------- Prizes ---------- */
  .prize-list{display:flex;flex-direction:column;gap:2px;}
  .prize-row{
    display:flex;align-items:center;gap:14px;padding:12px 0;
    border-top:1px solid var(--line);
  }
  .prize-row:first-child{border-top:none;}
  .prize-place{
    font-family:'Manrope';font-weight:800;font-size:16px;color:var(--amber);
    min-width:78px;
  }
  .prize-info{flex:1;}
  .prize-sub{font-size:12px;color:var(--chalk-dim);}
  .prize-winner{font-weight:700;font-size:14px;margin-top:2px;}
  .prize-amount{
    font-family:'Manrope';font-weight:800;font-size:18px;color:var(--win);
  }

  /* ---------- Draft recap grid ---------- */
  .draft-legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px;font-size:12px;color:var(--chalk-dim);}
  .draft-legend-item{display:flex;align-items:center;gap:6px;}
  .draft-dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
  table.draft-grid{table-layout:fixed;}
  table.draft-grid th{white-space:nowrap;padding:6px 8px 10px;}
  table.draft-grid td{
    font-size:12.5px;padding:7px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    max-width:120px;
  }
  .draft-total-row{
    display:flex;justify-content:space-between;margin-top:8px;padding-top:8px;
    border-top:2px solid var(--line);font-weight:800;font-size:13px;color:var(--amber);
  }
</style>
<script>
(function(){
  var saved = localStorage.getItem('fpl-draft-theme');
  if(saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
})();
</script>
</head>
<body>

<div class="hero">
  <div class="hero-inner wrap">
    <div class="hero-top">
      <div>
        <p class="eyebrow" id="scoring-format">Head-to-head draft league</p>
        <h1 id="league-name">Loading league…</h1>
      </div>
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
          <span id="theme-toggle-label">Dark mode</span>
        </button>
        <div class="gw-badge">
          <div class="label">Gameweek</div>
          <div class="value" id="gw-value">–</div>
          <div class="sub" id="gw-sub">–</div>
          <div class="countdown" id="gw-countdown"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="wrap">
  <div id="app">
    <div class="state-msg">Fetching data/league.json…</div>
  </div>
</div>

<footer>
  <span id="last-updated">–</span>
  <span>Unofficial dashboard · data via the public FPL Draft API · not affiliated with the Premier League</span>
</footer>

<script>
const DATA_URL = 'data/league.json';

(function initThemeToggle(){
  const btn = document.getElementById('theme-toggle');
  const label = document.getElementById('theme-toggle-label');
  function isDark(){ return document.documentElement.getAttribute('data-theme') === 'dark'; }
  function sync(){ label.textContent = isDark() ? 'Light mode' : 'Dark mode'; }
  sync();
  btn.addEventListener('click', () => {
    if(isDark()){
      document.documentElement.removeAttribute('data-theme');
      localStorage.setItem('fpl-draft-theme', 'light');
    }else{
      document.documentElement.setAttribute('data-theme', 'dark');
      localStorage.setItem('fpl-draft-theme', 'dark');
    }
    sync();
  });
})();

function formatDate(iso){
  if(!iso) return '–';
  try{
    const d = new Date(iso);
    return d.toLocaleString(undefined, { weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
  }catch(e){ return iso; }
}

function formatMelbourne(iso){
  if(!iso) return '–';
  try{
    const d = new Date(iso);
    return d.toLocaleString('en-AU', {
      timeZone: 'Australia/Melbourne',
      weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'
    }) + ' AEST/AEDT';
  }catch(e){ return iso; }
}

let countdownTimer = null;

function startCountdown(iso){
  const el = document.getElementById('gw-countdown');
  if(countdownTimer) clearInterval(countdownTimer);
  if(!iso){ el.textContent = ''; return; }
  const deadline = new Date(iso).getTime();

  function tick(){
    const diff = deadline - Date.now();
    if(diff <= 0){
      el.textContent = 'Deadline passed';
      clearInterval(countdownTimer);
      return;
    }
    const d = Math.floor(diff / 86400000);
    const h = Math.floor((diff % 86400000) / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    el.textContent = d > 0
      ? `${d}d ${h}h ${m}m`
      : `${h}h ${m}m ${s}s`;
  }
  tick();
  countdownTimer = setInterval(tick, 1000);
}

function formChips(form){
  if(!form || !form.length) return '<span style="color:var(--chalk-dim);font-size:12px;">–</span>';
  return '<div class="form">' + form.map(r => `<div class="chip ${r}">${r}</div>`).join('') + '</div>';
}

const TABS = [
  { id: 'table',    label: 'Table' },
  { id: 'fixtures', label: 'Fixtures' },
  { id: 'squads',   label: 'Squads' },
  { id: 'draft',    label: 'Draft Recap' },
  { id: 'playoffs', label: 'Playoffs' },
  { id: 'golden',   label: 'Golden GW' },
  { id: 'prizes',   label: 'Prizes' },
  { id: 'waivers',  label: 'Waivers' },
];

function getMyTeamId(data){
  const saved = localStorage.getItem('fpl-my-team');
  if(saved) return saved;
  return data.your_league_entry_id != null ? String(data.your_league_entry_id) : null;
}

function computeNextFixtureFor(data, leId){
  if(leId == null) return null;
  const events = Object.keys(data.fixtures_by_event).map(Number).sort((a,b) => a-b);
  const probes = [data.current_event, data.next_event, ...events].filter(e => e != null);
  for(const ev of probes){
    const fixtures = data.fixtures_by_event[String(ev)] || [];
    const match = fixtures.find(f =>
      String(f.home.league_entry_id) === String(leId) || String(f.away.league_entry_id) === String(leId));
    if(match) return { event: ev, ...match };
  }
  return null;
}

function render(data){
  document.getElementById('league-name').textContent = data.league.name || 'Draft League';
  document.getElementById('scoring-format').textContent =
    data.league.scoring === 'c' ? 'Classic scoring draft league' : 'Head-to-head draft league';
  document.getElementById('gw-value').textContent = data.current_event ? 'GW ' + data.current_event : '–';
  document.getElementById('gw-sub').textContent = data.next_deadline
    ? formatMelbourne(data.next_deadline)
    : '';
  startCountdown(data.next_deadline);
  document.getElementById('last-updated').textContent = 'Last updated ' + formatDate(data.generated_at);

  const app = document.getElementById('app');
  app.innerHTML = '';

  const myId = getMyTeamId(data);

  const viewAsWrap = document.createElement('div');
  viewAsWrap.className = 'view-as-bar';
  const sortedForSelect = [...data.standings].sort((a,b) => a.team_name.localeCompare(b.team_name));
  viewAsWrap.innerHTML = `
    <label for="view-as-select">Viewing as</label>
    <select id="view-as-select">
      <option value="">Pick your team…</option>
      ${sortedForSelect.map(r => `<option value="${r.league_entry_id}" ${String(r.league_entry_id)===String(myId)?'selected':''}>${r.team_name}</option>`).join('')}
    </select>
  `;
  viewAsWrap.querySelector('#view-as-select').addEventListener('change', (e) => {
    if(e.target.value){
      localStorage.setItem('fpl-my-team', e.target.value);
    }else{
      localStorage.removeItem('fpl-my-team');
    }
    render(data);
  });
  app.appendChild(viewAsWrap);

  const tabsWrap = document.createElement('div');
  tabsWrap.className = 'tabs';
  const panelsWrap = document.createElement('div');

  const panelBuilders = {
    table: () => {
      const grid = document.createElement('div');
      grid.className = 'grid';
      grid.appendChild(buildStandingsPanel(data, myId));
      grid.appendChild(buildSpotlightPanel(data, myId));
      const wrap = document.createElement('div');
      wrap.appendChild(grid);
      const secondGrid = document.createElement('div');
      secondGrid.className = 'grid';
      secondGrid.style.marginTop = '0';
      secondGrid.appendChild(buildStreaksPanel(data));
      secondGrid.appendChild(buildInFormPanel(data));
      wrap.appendChild(secondGrid);
      wrap.appendChild(buildWaiversClearedPanel(data));
      wrap.appendChild(buildProgressionPanel(data));
      return wrap;
    },
    fixtures: () => buildFixturesPanel(data),
    squads: () => buildSquadsPanel(data),
    draft: () => buildDraftRecapPanel(data),
    playoffs: () => buildPlayoffsPanel(data),
    golden: () => buildGoldenPanel(data),
    prizes: () => buildPrizesPanel(data),
    waivers: () => buildWaiversPanel(),
  };

  TABS.forEach((t, i) => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (i === 0 ? ' active' : '');
    btn.textContent = t.label;
    btn.addEventListener('click', () => {
      tabsWrap.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      panelsWrap.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      document.getElementById('panel-' + t.id).classList.add('active');
    });
    tabsWrap.appendChild(btn);

    const panel = document.createElement('div');
    panel.className = 'tab-panel' + (i === 0 ? ' active' : '');
    panel.id = 'panel-' + t.id;
    panel.appendChild(panelBuilders[t.id]());
    panelsWrap.appendChild(panel);
  });

  app.appendChild(tabsWrap);
  app.appendChild(panelsWrap);
}

function buildStandingsPanel(data, myId){
  const panel = document.createElement('div');
  panel.className = 'panel';
  panel.innerHTML = `<h2><span class="dot"></span>Standings</h2>`;

  const table = document.createElement('table');
  table.innerHTML = `
    <thead>
      <tr>
        <th></th><th>Team</th><th class="num">P</th><th class="num">W</th><th class="num">D</th>
        <th class="num">L</th><th class="num">PF</th><th class="num">PA</th><th class="num">Pts</th>
        <th style="text-align:right;">Form</th>
      </tr>
    </thead>
    <tbody></tbody>
  `;
  const tbody = table.querySelector('tbody');
  const lastRank = Math.max(...data.standings.map(r => r.rank || 0));
  data.standings.forEach(row => {
    const tr = document.createElement('tr');
    const classes = [];
    if(myId != null && String(row.league_entry_id) === String(myId)) classes.push('you');
    if(row.rank === 1 || row.rank === 2) classes.push('tier-strong');
    else if(row.rank === 3 || row.rank === 4) classes.push('tier-soft');
    tr.className = classes.join(' ');
    const medal = row.rank === 1 ? ' \u{1F451}' : (row.rank === lastRank ? ' \u{1F4A9}' : '');
    tr.innerHTML = `
      <td class="rank">${row.rank ?? '–'}${medal}</td>
      <td class="team-cell">
        <div class="name">${row.team_name}</div>
        <div class="manager">${row.manager_name}</div>
      </td>
      <td class="num">${row.played ?? 0}</td>
      <td class="num">${row.won ?? 0}</td>
      <td class="num">${row.drawn ?? 0}</td>
      <td class="num">${row.lost ?? 0}</td>
      <td class="num">${row.points_for ?? 0}</td>
      <td class="num">${row.points_against ?? 0}</td>
      <td class="pts">${row.total ?? 0}</td>
      <td>${formChips(row.form)}</td>
    `;
    tbody.appendChild(tr);
  });
  panel.appendChild(table);
  const legend = document.createElement('p');
  legend.style.cssText = 'font-size:11px;color:var(--chalk-dim);margin:10px 0 0;';
  legend.textContent = 'Top 2 go straight through to the final four; 3rd–4th also make the playoffs.';
  panel.appendChild(legend);
  return panel;
}

function buildSpotlightPanel(data, myId){
  const panel = document.createElement('div');
  panel.className = 'panel';
  const you = data.standings.find(r => String(r.league_entry_id) === String(myId));

  if(!you){
    panel.innerHTML = `<h2><span class="dot"></span>Your team</h2>
      <p style="color:var(--chalk-dim);font-size:13px;">Pick your team from the "Viewing as" dropdown above to spotlight it here.</p>`;
    return panel;
  }

  const nextFixture = computeNextFixtureFor(data, you.league_entry_id);
  let fixtureHtml = '<p style="color:var(--chalk-dim);font-size:13px;">No fixture found.</p>';
  if(nextFixture){
    const isHome = String(nextFixture.home.league_entry_id) === String(you.league_entry_id);
    const opp = isHome ? nextFixture.away : nextFixture.home;
    fixtureHtml = `
      <div class="next-fixture">
        <div style="font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:var(--chalk-dim);">
          ${nextFixture.finished ? 'Result' : 'Next up'} · GW ${nextFixture.event}
        </div>
        <div class="vs">vs ${opp.team_name}</div>
        <div style="color:var(--chalk-dim);">${opp.manager_name}</div>
      </div>
    `;
  }

  panel.innerHTML = `
    <h2><span class="dot"></span>Your team</h2>
    <div class="spot-rank">#${you.rank ?? '–'}</div>
    <div class="spot-name">${you.team_name}</div>
    <div class="spot-manager">${you.manager_name}</div>
    <div class="spot-stats">
      <div class="stat-box"><div class="v">${you.won}-${you.drawn}-${you.lost}</div><div class="l">W-D-L</div></div>
      <div class="stat-box"><div class="v">${you.points_for}</div><div class="l">Pts For</div></div>
      <div class="stat-box"><div class="v">${you.points_against}</div><div class="l">Pts Against</div></div>
      <div class="stat-box"><div class="v">${you.total}</div><div class="l">League Pts</div></div>
    </div>
    <div style="margin-top:8px;">${formChips(you.form)}</div>
    ${fixtureHtml}
  `;
  return panel;
}

function playerRow(p){
  const badges = [];
  if(p.is_captain) badges.push('<span class="cap-badge">C</span>');
  if(p.is_vice_captain) badges.push('<span class="cap-badge vc">VC</span>');
  if(p.subbed_in) badges.push('<span class="cap-badge sub-badge" title="Auto-subbed in">&#8593;</span>');
  if(p.subbed_out) badges.push('<span class="cap-badge sub-badge out" title="Auto-subbed out (did not play)">&#8595;</span>');
  const icons = [];
  if(p.goals > 0) icons.push(`<span class="stat-icon goal" title="${p.goals} goal${p.goals>1?'s':''}">&#9917;${p.goals>1?'&times;'+p.goals:''}</span>`);
  if(p.assists > 0) icons.push(`<span class="stat-icon assist" title="${p.assists} assist${p.assists>1?'s':''}">&#129918;${p.assists>1?'&times;'+p.assists:''}</span>`);
  const colors = POSITION_COLORS[p.position] || { bg: 'transparent', dot: 'var(--chalk-dim)' };
  const didNotPlay = p.minutes === 0;
  const ptsDisplay = didNotPlay ? '&ndash;' : p.points;
  return `
    <div class="squad-row" style="background:${colors.bg};border-left:3px solid ${colors.dot};${didNotPlay ? 'opacity:0.55;' : ''}">
      <span class="squad-pos">${p.position}</span>
      <span class="squad-name">${p.name}${badges.join('')}</span>
      <span class="squad-icons">${icons.join('')}</span>
      <span class="squad-pts">${ptsDisplay}</span>
    </div>
  `;
}

const POSITION_ORDER = { GKP: 0, DEF: 1, MID: 2, FWD: 3 };
function byPosition(list){
  return [...list].sort((a,b) => (POSITION_ORDER[a.position] ?? 9) - (POSITION_ORDER[b.position] ?? 9));
}

function squadColumn(label, squad){
  if(!squad){
    return `<div class="squad-col"><div class="squad-col-label">${label}</div><p style="font-size:12px;color:var(--chalk-dim);">No squad data for this gameweek.</p></div>`;
  }
  const playedLabel = squad.squad_size != null
    ? `<span class="squad-played-count">${squad.played_count}/${squad.squad_size} played</span>`
    : '';
  return `
    <div class="squad-col">
      <div class="squad-col-label">${label} ${playedLabel}</div>
      ${byPosition(squad.starting).map(playerRow).join('')}
      ${squad.bench.length ? `<div class="squad-bench-label">Subs</div>${byPosition(squad.bench).map(playerRow).join('')}` : ''}
    </div>
  `;
}

function buildInFormPanel(data){
  const panel = document.createElement('div');
  panel.className = 'panel';
  panel.innerHTML = `<h2><span class="dot"></span>In form</h2>`;
  const f = data.in_form;
  if(!f || (!f.most && !f.least)){
    panel.innerHTML += `<p style="color:var(--chalk-dim);font-size:13px;">Not enough finished gameweeks yet.</p>`;
    return panel;
  }
  const resultChips = (results) => results.map(r => `<span class="chip ${r}" style="width:16px;height:16px;font-size:9px;display:inline-flex;">${r}</span>`).join(' ');
  const rows = [];
  if(f.most){
    rows.push(`
      <div class="streak-row">
        <span class="streak-icon hot">&#128293;</span>
        <div><div class="streak-name">${f.most.team_name}</div>
        <div class="streak-sub">Last ${f.most.games_counted} games: ${resultChips(f.most.results)}</div></div>
      </div>
    `);
  }
  if(f.least && f.least.league_entry_id !== (f.most && f.most.league_entry_id)){
    rows.push(`
      <div class="streak-row">
        <span class="streak-icon cold">&#10052;&#65039;</span>
        <div><div class="streak-name">${f.least.team_name}</div>
        <div class="streak-sub">Last ${f.least.games_counted} games: ${resultChips(f.least.results)}</div></div>
      </div>
    `);
  }
  panel.innerHTML += rows.join('') || `<p style="color:var(--chalk-dim);font-size:13px;">Not enough data yet.</p>`;
  return panel;
}

function buildStreaksPanel(data){
  const panel = document.createElement('div');
  panel.className = 'panel';
  panel.innerHTML = `<h2><span class="dot"></span>Streaks</h2>`;
  const s = data.streaks;
  if(!s || (!s.hottest && !s.coldest)){
    panel.innerHTML += `<p style="color:var(--chalk-dim);font-size:13px;">No streaks yet.</p>`;
    return panel;
  }
  const rows = [];
  if(s.hottest && s.hottest.length > 1){
    rows.push(`
      <div class="streak-row">
        <span class="streak-icon hot">&#128293;</span>
        <div><div class="streak-name">${s.hottest.team_name}</div>
        <div class="streak-sub">${s.hottest.length} straight wins</div></div>
      </div>
    `);
  }
  if(s.coldest && s.coldest.length > 1){
    rows.push(`
      <div class="streak-row">
        <span class="streak-icon cold">&#10052;&#65039;</span>
        <div><div class="streak-name">${s.coldest.team_name}</div>
        <div class="streak-sub">${s.coldest.length} straight losses</div></div>
      </div>
    `);
  }
  panel.innerHTML += rows.length
    ? rows.join('')
    : `<p style="color:var(--chalk-dim);font-size:13px;">No streaks of more than one game yet.</p>`;
  return panel;
}

function buildWaiversClearedPanel(data){
  const panel = document.createElement('div');
  panel.className = 'panel';
  panel.innerHTML = `<h2><span class="dot"></span>Waivers cleared</h2>`;
  const tx = data.accepted_transactions || [];
  if(tx.length === 0){
    panel.innerHTML += `<p style="color:var(--chalk-dim);font-size:13px;">No waiver moves have cleared yet.</p>`;
    return panel;
  }
  const latestEvent = Math.max(...tx.map(t => t.event || 0));
  const recent = tx.filter(t => t.event === latestEvent);
  const rows = recent.map(t => `
    <div class="waiver-item" style="border-top:1px solid var(--line);">
      <span><b>${t.team_name}</b>${t.player_in ? ` picked up ${t.player_in}` : ''}${t.player_out ? `, dropped ${t.player_out}` : ''}</span>
      <span class="date">${t.kind}</span>
    </div>
  `).join('');
  panel.innerHTML += `<p style="font-size:11px;color:var(--chalk-dim);margin-top:-8px;">Cleared GW${latestEvent}</p>${rows}`;
  return panel;
}

function buildPrizesPanel(data){
  const panel = document.createElement('div');
  panel.className = 'panel';
  panel.innerHTML = `<h2><span class="dot"></span>Prizes</h2>`;

  const p = data.playoffs;
  const g = data.golden_gameweek;
  const finalWinner = p && p.final_winner ? p.final_winner.team_name : 'TBD';
  const finalRunnerUp = p && p.final && p.final_winner
    ? (String(p.final.team_a.league_entry_id) === String(p.final_winner.league_entry_id) ? p.final.team_b.team_name : p.final.team_a.team_name)
    : 'TBD';
  let thirdPlace = 'TBD';
  if(p && p.elim_winner && p.elim && p.elim.team_a && p.elim.team_b){
    thirdPlace = String(p.elim.team_a.league_entry_id) === String(p.elim_winner.league_entry_id)
      ? p.elim.team_b.team_name : p.elim.team_a.team_name;
  }
  const goldenWinner = g && g.leader ? `${g.leader.team_name} (${g.leader.points} pts, GW${g.leader.event})` : 'TBD';

  const prizes = [
    { place: '1st', sub: 'Playoff winner', amount: '$150', winner: finalWinner },
    { place: '2nd', sub: 'Playoff runner-up', amount: '$80', winner: finalRunnerUp },
    { place: '3rd', sub: 'Loses the second-chance (elimination) match', amount: '$40', winner: thirdPlace },
    { place: 'Golden GW', sub: 'Best single gameweek score all season', amount: '$50', winner: goldenWinner },
  ];

  panel.innerHTML += `
    <div class="prize-list">
      ${prizes.map(pr => `
        <div class="prize-row">
          <div class="prize-place">${pr.place}</div>
          <div class="prize-info">
            <div class="prize-sub">${pr.sub}</div>
            <div class="prize-winner">${pr.winner}</div>
          </div>
          <div class="prize-amount">${pr.amount}</div>
        </div>
      `).join('')}
    </div>
  `;
  return panel;
}

function buildSquadsPanel(data){
  const panel = document.createElement('div');
  panel.className = 'panel';
  const gw = data.latest_squad_event;
  panel.innerHTML = `<h2><span class="dot"></span>Squads${gw ? ` &mdash; as of GW ${gw}` : ''}</h2>`;

  const squads = data.latest_squads || {};
  const ranked = [...data.standings].sort((a,b) => (a.rank ?? 999) - (b.rank ?? 999));

  if(Object.keys(squads).length === 0){
    panel.innerHTML += `<p style="color:var(--chalk-dim);font-size:13px;">No squad data available yet.</p>`;
    return panel;
  }

  const wrap = document.createElement('div');
  wrap.style.cssText = 'overflow-x:auto;';
  const grid = document.createElement('div');
  grid.style.cssText = `display:grid;grid-template-columns:repeat(${ranked.length},minmax(160px,1fr));gap:14px;`;
  grid.innerHTML = ranked.map(r => {
    const squad = squads[String(r.league_entry_id)];
    const label = `#${r.rank} ${r.team_name}`;
    return squadColumn(label, squad);
  }).join('');
  wrap.appendChild(grid);
  panel.appendChild(wrap);

  return panel;
}

function buildFixturesPanel(data){
  const panel = document.createElement('div');
  panel.className = 'panel';
  panel.style.marginBottom = '24px';
  panel.innerHTML = `<h2><span class="dot"></span>Fixtures &amp; results</h2>`;

  const gwKeys = Object.keys(data.fixtures_by_event).map(Number).sort((a,b) => a-b);

  const modeWrap = document.createElement('div');
  modeWrap.className = 'gw-pills';
  modeWrap.style.marginBottom = '12px';
  const byGwBtn = document.createElement('button');
  byGwBtn.className = 'gw-pill active';
  byGwBtn.textContent = 'By gameweek';
  const byTeamBtn = document.createElement('button');
  byTeamBtn.className = 'gw-pill';
  byTeamBtn.textContent = 'By team';
  modeWrap.appendChild(byGwBtn);
  modeWrap.appendChild(byTeamBtn);

  const pillsWrap = document.createElement('div');
  pillsWrap.className = 'gw-pills';
  const teamSelectWrap = document.createElement('div');
  teamSelectWrap.style.cssText = 'margin-bottom:14px;display:none;';
  const sortedTeams = [...data.standings].sort((a,b) => a.team_name.localeCompare(b.team_name));
  teamSelectWrap.innerHTML = `
    <select id="fixtures-team-select" style="background:var(--card);border:1px solid var(--line);border-radius:8px;color:var(--chalk);padding:8px 12px;font-size:13px;">
      ${sortedTeams.map(t => `<option value="${t.league_entry_id}">${t.team_name}</option>`).join('')}
    </select>
  `;
  const listWrap = document.createElement('div');
  listWrap.className = 'fixture-list';

  function fixtureCard(f, showGwLabel){
    const homeWin = f.finished && f.home.score > f.away.score;
    const awayWin = f.finished && f.away.score > f.home.score;
    const hasSquads = !!f.squads;
    const card = document.createElement('div');
    card.className = 'fixture-card';
    card.innerHTML = `
      ${showGwLabel ? `<div style="font-size:11px;color:var(--chalk-dim);margin-bottom:6px;">GW ${f.event}</div>` : ''}
      <div class="fixture-row ${homeWin ? 'winner' : ''}">
        <div class="side"><span class="ha-tag">H</span>${f.home.team_name}<span class="m">${f.home.manager_name}</span></div>
        <div class="score">${f.home.score ?? '–'}</div>
      </div>
      <div class="fixture-row ${awayWin ? 'winner' : ''}">
        <div class="side"><span class="ha-tag">A</span>${f.away.team_name}<span class="m">${f.away.manager_name}</span></div>
        <div class="score">${f.away.score ?? '–'}</div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px;">
        <div class="status">${f.finished ? 'Final' : (f.started ? 'Live' : 'Not started')}</div>
        ${hasSquads ? `<button class="expand-btn">+ Players</button>` : ''}
      </div>
      ${hasSquads ? `<div class="squad-expand">
        <div class="squad-grid">
          ${squadColumn(f.home.team_name, f.squads[String(f.home.league_entry_id)])}
          ${squadColumn(f.away.team_name, f.squads[String(f.away.league_entry_id)])}
        </div>
      </div>` : ''}
    `;
    if(hasSquads){
      const btn = card.querySelector('.expand-btn');
      const expandArea = card.querySelector('.squad-expand');
      btn.addEventListener('click', () => {
        const open = expandArea.classList.toggle('open');
        btn.textContent = open ? '– Players' : '+ Players';
      });
    }
    return card;
  }

  function renderGw(gw){
    listWrap.innerHTML = '';
    const fixtures = data.fixtures_by_event[String(gw)] || [];
    fixtures.forEach(f => listWrap.appendChild(fixtureCard(f, false)));
  }

  function renderTeam(leId){
    listWrap.innerHTML = '';
    gwKeys.forEach(gw => {
      const fixtures = data.fixtures_by_event[String(gw)] || [];
      const match = fixtures.find(f =>
        String(f.home.league_entry_id) === String(leId) || String(f.away.league_entry_id) === String(leId));
      if(match) listWrap.appendChild(fixtureCard({ ...match, event: gw }, true));
    });
  }

  gwKeys.forEach(gw => {
    const pill = document.createElement('button');
    pill.className = 'gw-pill';
    pill.textContent = 'GW ' + gw;
    pill.addEventListener('click', () => {
      pillsWrap.querySelectorAll('.gw-pill').forEach(p => p.classList.remove('active'));
      pill.classList.add('active');
      renderGw(gw);
    });
    pillsWrap.appendChild(pill);
  });

  byGwBtn.addEventListener('click', () => {
    byGwBtn.classList.add('active');
    byTeamBtn.classList.remove('active');
    pillsWrap.style.display = '';
    teamSelectWrap.style.display = 'none';
    const activePill = pillsWrap.querySelector('.gw-pill.active') || pillsWrap.firstElementChild;
    if(activePill) renderGw(Number(activePill.textContent.replace('GW ', '')));
  });
  byTeamBtn.addEventListener('click', () => {
    byTeamBtn.classList.add('active');
    byGwBtn.classList.remove('active');
    pillsWrap.style.display = 'none';
    teamSelectWrap.style.display = '';
    renderTeam(teamSelectWrap.querySelector('select').value);
  });
  teamSelectWrap.querySelector('select').addEventListener('change', (e) => {
    renderTeam(e.target.value);
  });

  panel.appendChild(modeWrap);
  panel.appendChild(pillsWrap);
  panel.appendChild(teamSelectWrap);
  panel.appendChild(listWrap);

  const defaultGw = data.current_event && gwKeys.includes(data.current_event)
    ? data.current_event
    : gwKeys[gwKeys.length - 1];
  const defaultPill = [...pillsWrap.children].find(p => p.textContent === 'GW ' + defaultGw);
  if(defaultPill){ defaultPill.classList.add('active'); }
  if(defaultGw !== undefined) renderGw(defaultGw);

  return panel;
}

function buildProgressionPanel(data){
  const panel = document.createElement('div');
  panel.className = 'panel';
  panel.innerHTML = `<h2><span class="dot"></span>Points progression</h2>
    <div class="chart-wrap"><canvas id="progression-chart"></canvas></div>`;

  requestAnimationFrame(() => {
    const ctx = document.getElementById('progression-chart');
    const events = data.progression.events;
    const teamsObj = data.progression.teams;
    const yourLeId = data.your_league_entry_id;

    const palette = ['#6C3CE9','#E5484D','#F5A623','#1C63E8','#D6409F','#7A8C9E','#A67CF0','#2FA5A0','#C77DFF','#9C9BC0'];
    let colorIdx = 0;

    const datasets = Object.entries(teamsObj).map(([leId, t]) => {
      const isYou = String(yourLeId) === String(leId);
      const color = isYou ? '#F4B400' : palette[(colorIdx++) % palette.length];
      return {
        label: t.name,
        data: t.cumulative,
        borderColor: color,
        backgroundColor: color,
        borderWidth: isYou ? 3 : 1.5,
        pointRadius: isYou ? 3 : 0,
        tension: 0.25,
      };
    });

    const dimColor = getComputedStyle(document.documentElement).getPropertyValue('--chalk-dim').trim();
    const gridColor = getComputedStyle(document.documentElement).getPropertyValue('--line').trim();

    new Chart(ctx, {
      type: 'line',
      data: { labels: events.map(e => 'GW' + e), datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: 'nearest', intersect: false },
        plugins: {
          legend: { labels: { color: dimColor, font: { size: 11 } } },
        },
        scales: {
          x: { ticks: { color:dimColor }, grid: { color:gridColor } },
          y: { ticks: { color:dimColor }, grid: { color:gridColor } },
        }
      }
    });
  });

  return panel;
}

function matchRow({teamA, teamB, fixture, label, byeNote}){
  const played = fixture && fixture.finished && fixture.home.score !== null && fixture.away.score !== null;
  let winnerId = null;
  if(played){
    winnerId = fixture.home.score > fixture.away.score ? fixture.home.league_entry_id
             : fixture.away.score > fixture.home.score ? fixture.away.league_entry_id : null;
  }
  const nameA = teamA ? teamA.team_name : 'TBD';
  const nameB = teamB ? teamB.team_name : 'TBD';
  const idA = teamA ? teamA.league_entry_id : null;
  const idB = teamB ? teamB.league_entry_id : null;
  const dim = (id) => (winnerId && id !== winnerId) ? 'color:var(--chalk-dim);' : '';
  const div = document.createElement('div');
  div.className = 'fixture-card';
  div.style.marginBottom = '8px';
  div.innerHTML = `
    ${label ? `<div style="font-size:11px;color:var(--chalk-dim);margin-bottom:6px;">${label}</div>` : ''}
    <div class="fixture-row">
      <div class="side" style="${dim(idA)}">${nameA}</div>
      <div class="score">${played ? fixture.home.score : '–'}</div>
    </div>
    <div class="fixture-row">
      <div class="side" style="${dim(idB)}">${nameB}</div>
      <div class="score">${played ? fixture.away.score : '–'}</div>
    </div>
    ${byeNote ? `<div class="bye-note">${byeNote}</div>` : ''}
  `;
  return div;
}

const POSITION_COLORS = {
  FWD: { bg: 'rgba(229,72,77,0.14)', dot: '#E5484D', label: 'Forward' },
  MID: { bg: 'rgba(23,192,140,0.14)', dot: '#17C08C', label: 'Midfielder' },
  DEF: { bg: 'rgba(28,99,232,0.14)', dot: '#1C63E8', label: 'Defender' },
  GKP: { bg: 'rgba(244,180,0,0.16)', dot: '#C99A00', label: 'Goalkeeper' },
};

function buildDraftRecapPanel(data){
  const panel = document.createElement('div');
  panel.className = 'panel';
  panel.innerHTML = `<h2><span class="dot"></span>Draft recap</h2>`;

  const picks = data.draft_picks || [];
  if(picks.length === 0){
    const msg = document.createElement('p');
    msg.style.cssText = 'color:var(--chalk-dim);font-size:13px;';
    msg.textContent = 'No draft data available yet.';
    panel.appendChild(msg);
    return panel;
  }

  // Fixed column order: whichever team picked in each slot during the
  // earliest round (falls back to first-seen order for anyone missing it).
  const firstRound = Math.min(...picks.map(p => p.round ?? 1));
  const round1 = picks.filter(p => (p.round ?? 1) === firstRound);
  const columnOrder = [];
  const seen = new Set();
  [...round1, ...picks].forEach(p => {
    const key = String(p.league_entry_id ?? p.team_name);
    if(!seen.has(key)){ seen.add(key); columnOrder.push({ key, team_name: p.team_name, short_name: p.short_name }); }
  });

  const legend = document.createElement('div');
  legend.className = 'draft-legend';
  legend.innerHTML = Object.entries(POSITION_COLORS).map(([code, c]) => `
    <span class="draft-legend-item"><span class="draft-dot" style="background:${c.dot}"></span>${c.label}</span>
  `).join('');
  panel.appendChild(legend);

  const picksByTeam = {};
  columnOrder.forEach(c => picksByTeam[c.key] = []);
  picks.forEach(p => {
    const key = String(p.league_entry_id ?? p.team_name);
    if(picksByTeam[key]) picksByTeam[key].push(p);
  });
  Object.values(picksByTeam).forEach(list => list.sort((a,b) => (a.round ?? 0) - (b.round ?? 0)));

  const wrap = document.createElement('div');
  wrap.style.cssText = 'overflow-x:auto;';
  const grid = document.createElement('div');
  grid.style.cssText = `display:grid;grid-template-columns:repeat(${columnOrder.length},minmax(150px,1fr));gap:14px;`;
  grid.innerHTML = columnOrder.map(c => {
    const teamPicks = picksByTeam[c.key];
    const total = teamPicks.reduce((sum, p) => sum + (p.season_points || 0), 0);
    return `
      <div class="squad-col">
        <div class="squad-col-label">${c.team_name}</div>
        ${teamPicks.map(p => {
          const colors = POSITION_COLORS[p.position] || { bg: 'transparent', dot: 'var(--chalk-dim)' };
          return `
            <div class="squad-row" style="background:${colors.bg};border-left:3px solid ${colors.dot};grid-template-columns:26px 1fr 34px;">
              <span class="squad-pos">R${p.round}</span>
              <span class="squad-name">${p.player_name}</span>
              <span class="squad-pts">${p.season_points || 0}</span>
            </div>
          `;
        }).join('')}
        <div class="draft-total-row">
          <span>Total</span><span>${total}</span>
        </div>
      </div>
    `;
  }).join('');
  wrap.appendChild(grid);
  panel.appendChild(wrap);

  return panel;
}

function buildPlayoffsPanel(data){
  const panel = document.createElement('div');
  panel.className = 'panel';
  panel.innerHTML = `<h2><span class="dot"></span>Playoff bracket</h2>`;

  const p = data.playoffs;
  if(!p){
    const msg = document.createElement('p');
    msg.style.cssText = 'color:var(--chalk-dim);font-size:13px;';
    msg.textContent = 'The bracket seeds automatically once the regular season standings have at least 4 teams.';
    panel.appendChild(msg);
    return panel;
  }

  const semiLabel = document.createElement('div');
  semiLabel.className = 'bracket-round-label';
  semiLabel.textContent = `Semi-finals · GW${p.semi_gw}`;
  panel.appendChild(semiLabel);
  panel.appendChild(matchRow({teamA: p.semi_a.team_a, teamB: p.semi_a.team_b, fixture: p.semi_a.fixture}));
  panel.appendChild(matchRow({teamA: p.semi_b.team_a, teamB: p.semi_b.team_b, fixture: p.semi_b.fixture}));

  const elimLabel = document.createElement('div');
  elimLabel.className = 'bracket-round-label';
  elimLabel.textContent = `Elimination · GW${p.elim_gw}`;
  panel.appendChild(elimLabel);
  panel.appendChild(matchRow({
    teamA: p.elim.team_a, teamB: p.elim.team_b, fixture: p.elim.fixture,
    label: 'Loser of semi A vs winner of semi B',
    byeNote: p.semi_a_bye_to_final ? `${p.semi_a_bye_to_final.team_name} gets a bye straight to the final.` : null,
  }));

  const finalLabel = document.createElement('div');
  finalLabel.className = 'bracket-round-label';
  finalLabel.textContent = `Final · GW${p.final_gw}`;
  panel.appendChild(finalLabel);
  panel.appendChild(matchRow({teamA: p.final.team_a, teamB: p.final.team_b, fixture: p.final.fixture}));

  if(p.final_winner){
    const banner = document.createElement('div');
    banner.className = 'champion-banner';
    banner.innerHTML = `<i class="ti ti-trophy" aria-hidden="true"></i> ${p.final_winner.team_name} wins the league`;
    panel.appendChild(banner);
  }

  return panel;
}

function buildGoldenPanel(data){
  const panel = document.createElement('div');
  panel.className = 'panel';
  const g = data.golden_gameweek;
  panel.innerHTML = `<h2><span class="dot"></span>Golden gameweek prize</h2>
    <p style="font-size:12px;color:var(--chalk-dim);margin-top:-8px;">
      Highest single-gameweek score across the whole season (GW1–${g ? g.season_end : '–'}). One score per team, best gameweek only.
    </p>`;

  if(!g || !g.leader){
    const msg = document.createElement('p');
    msg.style.cssText = 'color:var(--chalk-dim);font-size:13px;';
    msg.textContent = 'Scores will appear here once the season is underway.';
    panel.appendChild(msg);
    return panel;
  }

  const leaderDiv = document.createElement('div');
  leaderDiv.className = 'golden-leader';
  leaderDiv.innerHTML = `
    <div class="label">Current leader</div>
    <div class="value">${g.leader.team_name} · ${g.leader.points} pts (GW${g.leader.event})</div>
  `;
  panel.appendChild(leaderDiv);

  const table = document.createElement('table');
  table.innerHTML = `
    <thead><tr>
      <th style="width:28px;"></th><th>Team</th>
      <th class="num" style="width:50px;">GW</th><th class="num" style="width:50px;">Pts</th>
    </tr></thead>
    <tbody>${g.leaderboard.map((r, i) => `
      <tr>
        <td class="rank">${i + 1}</td>
        <td>${r.team_name}</td>
        <td class="num">${r.event}</td>
        <td class="pts">${r.points}</td>
      </tr>
    `).join('')}</tbody>
  `;
  panel.appendChild(table);
  return panel;
}

const WAIVERS_KEY = 'fpl-draft-waivers';

function loadWaivers(){
  try{ return JSON.parse(localStorage.getItem(WAIVERS_KEY) || '[]'); }
  catch(e){ return []; }
}
function saveWaivers(list){
  try{ localStorage.setItem(WAIVERS_KEY, JSON.stringify(list)); }catch(e){}
}

function buildWaiversPanel(){
  const panel = document.createElement('div');
  panel.className = 'panel';
  panel.innerHTML = `<h2><span class="dot"></span>Waivers</h2>
    <p style="font-size:12px;color:var(--chalk-dim);margin-top:-8px;margin-bottom:14px;">
      The Draft API doesn't expose waiver moves, so log them here manually. Saved in your browser only,
      on this device.
    </p>`;

  const row = document.createElement('div');
  row.className = 'waiver-input-row';
  const input = document.createElement('input');
  input.placeholder = 'e.g. Team A dropped X, picked up Y';
  const addBtn = document.createElement('button');
  addBtn.textContent = 'Add';
  row.appendChild(input);
  row.appendChild(addBtn);
  panel.appendChild(row);

  const list = document.createElement('div');
  panel.appendChild(list);

  function renderList(){
    const items = loadWaivers();
    list.innerHTML = '';
    if(items.length === 0){
      list.innerHTML = '<p style="color:var(--chalk-dim);font-size:13px;">No waiver moves logged yet.</p>';
      return;
    }
    items.forEach((w, idx) => {
      const el = document.createElement('div');
      el.className = 'waiver-item';
      el.innerHTML = `
        <span>${w.text}</span>
        <span style="display:flex;align-items:center;gap:10px;">
          <span class="date">${new Date(w.date).toLocaleDateString()}</span>
          <button class="del" data-idx="${idx}">Remove</button>
        </span>
      `;
      list.appendChild(el);
    });
    list.querySelectorAll('.del').forEach(btn => {
      btn.addEventListener('click', () => {
        const items = loadWaivers();
        items.splice(Number(btn.dataset.idx), 1);
        saveWaivers(items);
        renderList();
      });
    });
  }

  addBtn.addEventListener('click', () => {
    const text = input.value.trim();
    if(!text) return;
    const items = loadWaivers();
    items.unshift({ text, date: new Date().toISOString() });
    saveWaivers(items);
    input.value = '';
    renderList();
  });
  input.addEventListener('keydown', (e) => { if(e.key === 'Enter') addBtn.click(); });

  renderList();
  return panel;
}

fetch(DATA_URL)
  .then(r => {
    if(!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  })
  .then(render)
  .catch(err => {
    document.getElementById('app').innerHTML = `
      <div class="state-msg">
        Couldn't load <code>${DATA_URL}</code> (${err.message}).<br/>
        If you're viewing this locally, serve the folder over HTTP rather than opening the file directly,
        or wait for the "Update league data" GitHub Action to run once on the live site.
      </div>`;
  });
</script>
