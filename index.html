<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Draft League Dashboard</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="icons/favicon-192.png">
<link rel="apple-touch-icon" href="icons/favicon-512.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1C63E8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.47.0/iconfont/tabler-icons.min.css">
<style>.ti{font-family:'tabler-icons';font-style:normal;}</style>
<style>
  :root{
    --bg: #F3F3FB;
    --card: #FFFFFF;
    --ink: #F6F6FC;
    --line: #E6E5F2;
    --chalk: #16152B;
    --chalk-dim: #6C6B87;
    --amber: #00C2A0;
    --amber-dim: #BFEFE5;
    --loss: #E5484D;
    --draw: #A6A5C0;
    --win: #17C08C;
    --radius: 12px;
    --grad-a: #3B1E9E;
    --grad-b: #1C63E8;
    --grad-c: #14D2E0;
    --shadow: 0 1px 2px rgba(20,16,60,0.04), 0 6px 20px rgba(20,16,60,0.06);
  }
  [data-theme="dark"]{
    --bg: #0F0E22;
    --card: #191833;
    --ink: #201F3E;
    --line: #322F58;
    --chalk: #F2F1FA;
    --chalk-dim: #9C9BC0;
    --amber: #2EE6C8;
    --amber-dim: #1B4A44;
    --loss: #FF6B6E;
    --draw: #7A79A0;
    --win: #2EE6A8;
    --grad-a: #241259;
    --grad-b: #123B8E;
    --grad-c: #0C7A86;
    --shadow: 0 1px 2px rgba(0,0,0,0.2), 0 6px 20px rgba(0,0,0,0.3);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--chalk);
    font-family:'Inter', system-ui, sans-serif;
    min-height:100vh;
    padding-bottom:60px;
    transition:background 0.2s ease, color 0.2s ease;
  }
  .wrap{max-width:1100px;margin:0 auto;padding:0 20px;}

  /* ---------- Hero ---------- */
  .hero{
    background:linear-gradient(120deg, var(--grad-a) 0%, var(--grad-b) 55%, var(--grad-c) 100%);
    border-radius:0 0 20px 20px;
    padding:18px 24px 16px;
    margin:0 0 18px;
  }
  .hero-inner{max-width:1060px;margin:0 auto;}
  .hero-top{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:16px;}
  .eyebrow{
    font-size:12px;
    font-weight:700;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:rgba(255,255,255,0.85);
    margin:0 0 4px;
  }
  h1{
    font-family:'Manrope', sans-serif;
    font-weight:800;
    font-size:28px;
    line-height:1.1;
    margin:0;
    color:#FFFFFF;
  }
  .theme-toggle{
    background:rgba(255,255,255,0.16);
    border:1px solid rgba(255,255,255,0.3);
    color:#fff;
    border-radius:20px;
    padding:6px 14px;
    font-size:12px;font-weight:600;
    cursor:pointer;
    display:flex;align-items:center;gap:6px;
  }
  .theme-toggle:hover{background:rgba(255,255,255,0.26);}
  .gw-badge{
    background:rgba(255,255,255,0.14);
    border:1px solid rgba(255,255,255,0.28);
    border-radius:var(--radius);
    padding:7px 16px;
    text-align:right;
    min-width:150px;
  }
  .gw-badge .label{font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.75);}
  .gw-badge .value{font-size:19px;font-weight:800;font-family:'Manrope';color:#fff;}
  .gw-badge .sub{font-size:12px;color:rgba(255,255,255,0.75);margin-top:2px;}
  .gw-badge .countdown{
    font-family:'Manrope';font-weight:700;font-size:14px;color:#fff;
    margin-top:2px;
  }

  /* ---------- Layout grid ---------- */
  .grid{display:grid;grid-template-columns:1.7fr 1fr;gap:16px;margin-bottom:16px;}
  .grid > *{min-width:0;}
  @media (max-width:840px){ .grid{grid-template-columns:1fr;} }

  .panel{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    box-shadow:var(--shadow);
    padding:16px 18px;
  }
  .panel h2{
    font-family:'Manrope', sans-serif;
    font-weight:700;
    font-size:16px;
    margin:0 0 10px;
    color:var(--chalk);
    display:flex;align-items:center;gap:8px;
  }
  .panel h2 .dot{width:8px;height:8px;border-radius:50%;background:var(--amber);}

  /* ---------- Standings table ---------- */
  table{width:100%;min-width:520px;border-collapse:collapse;}
  thead th{
    text-align:left;
    font-size:11px;
    font-weight:700;
    letter-spacing:0.05em;
    text-transform:uppercase;
    color:var(--chalk-dim);
    padding:0 8px 10px;
    border-bottom:1px solid var(--line);
  }
  tbody td{
    padding:10px 8px;
    border-bottom:1px solid var(--line);
    font-size:14px;
    vertical-align:middle;
  }
  tbody tr.you{background:var(--amber-dim);}
  tbody tr.you td:first-child{box-shadow: inset 3px 0 0 var(--amber);}
  tbody tr.tier-strong:not(.you){background:rgba(108,60,233,0.10);}
  tbody tr.tier-soft:not(.you){background:rgba(108,60,233,0.04);}
  [data-theme="dark"] tbody tr.tier-strong:not(.you){background:rgba(108,60,233,0.22);}
  [data-theme="dark"] tbody tr.tier-soft:not(.you){background:rgba(108,60,233,0.10);}
  .rank{color:var(--chalk-dim);width:26px;font-weight:600;}
  .team-cell .name{font-weight:700;}
  .team-cell .manager{font-size:12px;color:var(--chalk-dim);}

  /* ---------- Standings list (compact, expandable rows) ---------- */
  .standings-list{display:flex;flex-direction:column;}
  .standing-row{border-bottom:1px solid var(--line);border-radius:8px;cursor:pointer;}
  .standing-row.expanded{background:var(--ink);}
  .team-detail-dropdown{
    background:var(--ink);border-radius:8px;padding:10px 12px 12px;margin:2px 0 8px;
    animation:receipt-pop-in 0.15s ease-out;
  }
  .standing-row:last-child{border-bottom:none;}
  .standing-row.you{background:var(--amber-dim);}
  .standing-row.you .standing-main{box-shadow: inset 3px 0 0 var(--amber);}
  .standing-row.tier-strong:not(.you){background:rgba(108,60,233,0.10);}
  .standing-row.tier-soft:not(.you){background:rgba(108,60,233,0.04);}
  [data-theme="dark"] .standing-row.tier-strong:not(.you){background:rgba(108,60,233,0.22);}
  [data-theme="dark"] .standing-row.tier-soft:not(.you){background:rgba(108,60,233,0.10);}
  .standing-main{
    display:flex;align-items:center;gap:8px;padding:10px 8px;
  }
  .standing-main .rank{width:auto;flex-shrink:0;font-size:13px;}
  .rank-change{
    display:inline-block;margin-left:3px;font-size:9px;font-weight:700;
    vertical-align:middle;
  }
  .rank-change.up{color:var(--win);}
  .rank-change.down{color:var(--loss);}
  .rank-change.same{color:var(--chalk-dim);}
  .team-detail-lines{display:flex;flex-direction:column;gap:6px;margin-top:6px;}
  .team-detail-upcoming{display:flex;flex-direction:column;gap:6px;margin-top:6px;}
  .team-detail-result{border-radius:6px;padding:6px 8px;margin:0 -8px;}
  .team-detail-result.win{background:rgba(29,158,117,0.14);}
  .team-detail-result.loss{background:rgba(224,72,72,0.12);}
  .team-detail-result.win strong{color:var(--win);}
  .team-detail-result.loss strong{color:var(--loss);}
  .standing-main .team-cell{flex:1;min-width:0;}
  .standing-main .team-cell .name{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .standing-main .team-cell .manager{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .standing-record{
    font-size:12.5px;font-weight:600;color:var(--chalk-dim);flex-shrink:0;white-space:nowrap;
    width:48px;text-align:right;
  }
  .standing-pf{font-size:12.5px;font-weight:700;flex-shrink:0;white-space:nowrap;width:76px;text-align:right;}
  .standing-pf .diff{font-size:10.5px;font-weight:600;}
  .standing-pf .diff.pos{color:var(--win);}
  .standing-pf .diff.neg{color:var(--loss);}
  .standing-pts{
    font-family:'Manrope';font-weight:800;font-size:15px;color:var(--amber);flex-shrink:0;
    min-width:24px;text-align:right;
  }
  .standing-header{
    display:flex;align-items:center;gap:8px;padding:0 8px 6px;
    font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:var(--chalk-dim);
    border-bottom:1px solid var(--line);margin-bottom:2px;
  }
  .standing-header span:first-child{width:26px;flex-shrink:0;}
  .standing-header span:nth-child(2){flex:1;}
  .standing-header span:nth-child(3){width:48px;text-align:right;flex-shrink:0;}
  .standing-header span:nth-child(4){width:76px;text-align:right;flex-shrink:0;}
  .standing-header span:nth-child(5){min-width:24px;text-align:right;flex-shrink:0;}
  @media (max-width:420px){
    .standing-record{width:40px;font-size:11px;}
    .standing-pf{width:64px;font-size:11px;}
  }
  .num{
    font-variant-numeric:tabular-nums;
    text-align:right;
  }
  .pts{
    font-weight:800;
    color:var(--amber);
    text-align:right;
  }
  .form{display:flex;gap:3px;justify-content:flex-end;}
  .chip{
    width:18px;height:18px;border-radius:6px;
    font-size:10px;font-weight:700;
    display:flex;align-items:center;justify-content:center;
    color:#fff;
  }
  .chip.W{background:var(--win);}
  .chip.D{background:var(--draw);}
  .chip.L{background:var(--loss);}

  /* ---------- Your team spotlight ---------- */
  .spot-rank{font-family:'Manrope';font-weight:800;font-size:38px;color:var(--amber);line-height:1;}
  .spot-name{font-weight:700;font-size:17px;margin-top:4px;}
  .spot-manager{color:var(--chalk-dim);font-size:13px;margin-bottom:14px;}
  .spot-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0;}
  .stat-box{background:var(--ink);border-radius:10px;padding:8px 6px;text-align:center;}
  .star-box{display:flex;align-items:center;gap:10px;text-align:left;padding:8px 10px;}
  .star-photo{
    position:relative;width:36px;height:36px;flex-shrink:0;overflow:hidden;
    border-radius:8px;background:var(--card);
  }
  .star-photo img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;}
  .star-photo-fallback{object-fit:contain;padding:2px;box-sizing:border-box;}
  .stat-box .v{font-family:'Manrope';font-weight:700;font-size:17px;color:var(--amber);}
  .stat-box .l{font-size:10px;color:var(--chalk-dim);text-transform:uppercase;letter-spacing:0.05em;margin-top:2px;}
  .next-fixture{
    border-top:1px solid var(--line);
    margin-top:14px;padding-top:14px;
    font-size:13px;
  }
  .next-fixture .vs{font-family:'Manrope';font-weight:700;font-size:19px;margin:4px 0;}

  /* ---------- Fixtures ---------- */
  .gw-pills{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;padding-bottom:4px;}
  .gw-pill{
    font-size:12px;font-weight:600;
    padding:6px 14px;
    border-radius:20px;
    border:1px solid var(--line);
    background:var(--ink);
    color:var(--chalk-dim);
    cursor:pointer;
    white-space:nowrap;
  }
  .gw-pill.active{background:var(--amber);border-color:var(--amber);color:#fff;}
  .fixture-list{display:flex;flex-direction:column;gap:10px;}
  .fixture-list.field-mode{grid-template-columns:1fr;gap:14px;}
  .fixture-card-field{padding:14px;}
  @media (max-width:480px){
    .fixture-card-field{padding:10px 6px;}
    .pitch-container{gap:6px;}
  }

  /* ---------- Field view ---------- */
  .matchup-wrap{max-width:640px;margin:0 auto;}
  .matchup-header{
    display:flex;align-items:flex-end;justify-content:center;gap:8px;margin-bottom:8px;
    flex-wrap:wrap;
  }
  .matchup-side{text-align:center;min-width:100px;flex:1;max-width:320px;}
  .matchup-name{font-size:14px;font-weight:700;color:var(--chalk);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .matchup-manager{font-size:11px;color:var(--chalk-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
  @media (max-width:400px){
    .matchup-header{flex-wrap:nowrap;gap:4px;}
    .matchup-side{min-width:0;}
    .matchup-name{font-size:10.5px;}
    .matchup-played{font-size:9px;padding:1px 5px;}
    .matchup-scoreboard{padding:5px 8px;gap:5px;}
    .matchup-score{font-size:14px;}
    .matchup-status{font-size:8.5px;}
  }
  .matchup-played{
    display:inline-block;margin-top:3px;background:rgba(29,158,117,0.14);color:var(--win);
    font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:10px;
  }
  .matchup-scoreboard{
    background:#0B0F1A;border-radius:10px;padding:6px 14px;display:flex;align-items:center;gap:8px;
    flex-shrink:0;
  }
  .matchup-score{color:#fff;font-size:17px;font-weight:800;font-family:'Manrope';}
  .matchup-status{color:rgba(255,255,255,0.5);font-size:10px;font-weight:700;}
  .pitch-container{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 auto;max-width:640px;}
  @media (max-width:640px){ .pitch-container{grid-template-columns:1fr;} }
  .pitch-col{min-width:0;}
  .pitch-team-label{
    font-size:12px;font-weight:700;text-align:center;margin-bottom:6px;color:var(--chalk);
  }
  .pitch-team-score{
    display:inline-block;background:var(--ink);color:var(--amber);font-weight:800;
    border-radius:6px;padding:1px 7px;margin-left:4px;font-size:12px;
  }
  .pitch{
    position:relative;overflow:hidden;aspect-ratio:1/1.35;
    background:
      radial-gradient(120% 70% at 50% 0%, rgba(60,220,150,0.18), transparent 60%),
      repeating-linear-gradient(0deg, #1E6B3C, #1E6B3C 22px, #237D46 22px, #237D46 44px);
    box-shadow:inset 0 0 40px rgba(0,0,0,0.25);
    border-radius:10px;padding:10px 2px;
  }
  .pitch-lines{position:absolute;inset:0;width:100%;height:100%;}
  .pitch-rows{
    position:relative;z-index:1;height:100%;
    display:flex;flex-direction:column;justify-content:space-around;gap:4px;
  }
  /* nowrap is deliberate: a formation row must always fit on one line -
     wrapping (e.g. a 5-man defence overflowing to 2 lines) breaks the
     fixed vertical spacing between GKP/DEF/MID/FWD and causes real visual
     collisions further down the pitch. Cards shrink via min-width:0 on
     .field-player instead of ever wrapping. */
  .pitch-row{display:flex;justify-content:space-evenly;flex-wrap:nowrap;gap:2px;}
  .pitch-bench-row{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:8px;}
  /* Bench sits on the normal panel background, not the green pitch, so it
     needs theme-aware text instead of the pill styling tuned for turf. */
  .pitch-bench-row .field-pill{background:var(--card);border:1px solid var(--line);}
  .pitch-bench-row .field-name{color:var(--chalk);}
  .pitch-bench-row .field-pts{color:var(--chalk-dim);}
  .field-player{
    display:flex;flex-direction:column;align-items:center;cursor:pointer;
    flex:1 1 0;min-width:0;max-width:64px;
  }
  .field-photo{
    position:relative;width:100%;max-width:44px;aspect-ratio:1/1;
    display:flex;align-items:flex-end;justify-content:center;
  }
  .field-photo img{width:100%;height:auto;max-height:100%;object-fit:contain;display:block;}
  .field-jersey-fallback{width:100%;height:auto;max-height:100%;object-fit:contain;}
  .field-cap{
    position:absolute;top:-2px;left:-2px;background:var(--amber);color:#fff;
    font-size:8px;font-weight:800;border-radius:50%;width:14px;height:14px;
    display:flex;align-items:center;justify-content:center;border:1px solid #fff;z-index:2;
  }
  .field-cap.vc{background:var(--draw);}
  .field-sub-tag{
    position:absolute;top:-2px;right:-2px;color:#fff;
    font-size:9px;font-weight:800;border-radius:50%;width:14px;height:14px;
    display:flex;align-items:center;justify-content:center;border:1px solid #fff;z-index:2;
  }
  .field-sub-tag.on{background:var(--win);}
  .field-sub-tag.off{background:var(--loss);}
  .field-pill{
    background:#0B0F1A;border-radius:6px;padding:3px 6px;margin-top:4px;text-align:center;
    width:100%;box-sizing:border-box;
  }
  .field-name{
    color:#fff;font-size:8.5px;font-weight:700;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;
  }
  .field-pts{
    color:#5DCAA5;font-size:11px;font-weight:800;font-family:'Manrope';
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .fixture-card{
    background:var(--ink);border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;cursor:pointer;transition:border-color 0.15s;
  }
  .fixture-card:hover{border-color:var(--win);}
  .fixture-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;}
  .fixture-row .side{font-size:13px;}
  .ha-tag{
    display:inline-block;width:16px;height:16px;line-height:16px;text-align:center;
    font-size:9px;font-weight:700;border-radius:4px;background:var(--ink);color:var(--chalk-dim);
    margin-right:6px;vertical-align:middle;
  }
  .fixture-row .side .m{display:block;font-size:11px;color:var(--chalk-dim);}
  .played-tag{
    display:inline-block;margin-left:4px;font-size:10px;font-weight:600;
    color:var(--chalk-dim);background:var(--card);border-radius:4px;padding:0 4px;
  }
  .fixture-row .score{
    font-family:'Manrope';font-size:17px;font-weight:700;
    min-width:28px;text-align:center;
  }
  .fixture-row.winner .score{color:var(--amber);}
  .fixture-card .status{font-size:10px;text-transform:uppercase;letter-spacing:0.06em;color:var(--chalk-dim);margin-top:6px;}
  .fixture-expand-hint{
    text-align:center;font-size:11px;font-weight:700;color:var(--win);margin-bottom:2px;
  }

  /* ---------- Squad expand ---------- */
  .expand-btn{
    background:none;border:none;color:var(--amber);font-size:11px;font-weight:700;
    cursor:pointer;padding:2px 0;
  }
  .squad-expand{display:none;margin-top:10px;}
  .squad-expand.open{display:block;}
  .squad-expand-area{display:none;margin-top:8px;cursor:default;}
  .squad-expand-area.open{display:block;}
  .view-switch{display:flex;justify-content:center;gap:8px;margin-bottom:10px;}
  .view-switch-btn{
    background:var(--card);border:1px solid var(--line);color:var(--chalk-dim);
    font-size:12px;font-weight:700;padding:5px 16px;border-radius:16px;cursor:pointer;
  }
  .view-switch-btn.active{background:var(--win);border-color:var(--win);color:#fff;}
  .fixture-close-btn{
    display:block;margin:14px auto 2px;background:var(--card);border:1px solid var(--line);
    color:var(--chalk-dim);font-size:12px;font-weight:700;padding:7px 20px;
    border-radius:16px;cursor:pointer;
  }
  .dual-expand{display:flex;gap:12px;justify-content:flex-end;margin-top:-6px;margin-bottom:4px;}
  .fixture-card-expanded{grid-column:1 / -1;}
  .squad-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:14px;
    border-top:1px solid var(--line);padding-top:10px;
  }
  @media (max-width:520px){ .squad-grid{grid-template-columns:1fr;} }
  .squad-col-label{font-size:11px;font-weight:700;color:var(--chalk-dim);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.04em;}
  .squad-bench-label{font-size:10px;font-weight:700;color:var(--chalk-dim);margin:8px 0 4px;text-transform:uppercase;}
  .squad-row{
    display:grid;grid-template-columns:1fr auto 30px;align-items:center;gap:6px;
    font-size:12.5px;padding:3px 6px;border-radius:4px;cursor:pointer;
  }
  .squad-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .draft-round{font-size:10px;font-weight:700;color:var(--chalk-dim);}
  .opp-tag{
    display:inline-block;margin-left:5px;font-size:9px;font-weight:700;
    background:var(--ink);color:var(--chalk-dim);border-radius:4px;padding:0 4px;vertical-align:middle;
  }

<body>

<div class="hero">
  <div class="hero-inner wrap">
    <div class="hero-top">
      <div>
        <p class="eyebrow" id="scoring-format">Head-to-head draft league</p>
        <h1 id="league-name">Loading league…</h1>
      </div>
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
          <span id="theme-toggle-label">Dark mode</span>
        </button>
        <div class="gw-badge">
          <div class="label">Gameweek</div>
          <div class="value" id="gw-value">–</div>
          <div class="sub" id="gw-sub">–</div>
          <div class="countdown" id="gw-countdown"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="wrap">
  <div id="app">
    <div class="state-msg">Fetching data/league.json…</div>
  </div>
</div>

<footer>
  <span id="last-updated">–</span>
  <span>Unofficial dashboard · data via the public FPL Draft API · not affiliated with the Premier League</span>
</footer>

<script>
const DATA_URL = 'data/league.json';

(function initThemeToggle(){
  const btn = document.getElementById('theme-toggle');
  const label = document.getElementById('theme-toggle-label');
  function isDark(){ return document.documentElement.getAttribute('data-theme') === 'dark'; }
  function sync(){ label.textContent = isDark() ? 'Light mode' : 'Dark mode'; }
  sync();
  btn.addEventListener('click', () => {
    if(isDark()){
      document.documentElement.removeAttribute('data-theme');
      localStorage.setItem('fpl-draft-theme', 'light');
    }else{
      document.documentElement.setAttribute('data-theme', 'dark');
      localStorage.setItem('fpl-draft-theme', 'dark');
    }
    sync();
  });
})();

function formatDate(iso){
  if(!iso) return '–';
  try{
    const d = new Date(iso);
    return d.toLocaleString(undefined, { weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
  }catch(e){ return iso; }
}

function formatMelbourne(iso){
  if(!iso) return '–';
  try{
    const d = new Date(iso);
    return d.toLocaleString('en-AU', {
      timeZone: 'Australia/Melbourne',
      weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'
    }) + ' AEST/AEDT';
  }catch(e){ return iso; }
}

let countdownTimer = null;

function startCountdown(iso){
  const el = document.getElementById('gw-countdown');
  if(countdownTimer) clearInterval(countdownTimer);
  if(!iso){ el.textContent = ''; return; }
  const deadline = new Date(iso).getTime();

  function tick(){
    const diff = deadline - Date.now();
    if(diff <= 0){
      el.textContent = 'Deadline passed';
      clearInterval(countdownTimer);
      return;
    }
    const d = Math.floor(diff / 86400000);
    const h = Math.floor((diff % 86400000) / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    el.textContent = d > 0
      ? `${d}d ${h}h ${m}m`
      : `${h}h ${m}m ${s}s`;
  }
  tick();
  countdownTimer = setInterval(tick, 1000);
}

function formChips(form){
  if(!form || !form.length) return '<span style="color:var(--chalk-dim);font-size:12px;">–</span>';
  return '<div class="form">' + form.map(r => `<div class="chip ${r}">${r}</div>`).join('') + '</div>';
}

const TABS = [
  { id: 'table',    label: 'Home' },
  { id: 'standings',label: 'Table' },
  { id: 'fixtures', label: 'Fixtures' },
  { id: 'squads',   label: 'Squads' },
  { id: 'draft',    label: 'Draft Recap' },
  { id: 'playoffs', label: 'Finals' },
  { id: 'golden',   label: 'Top Score' },
  { id: 'prizes',   label: 'Prizes' },
  { id: 'waivers',  label: 'Waivers' },
];

function getMyTeamId(data){
  const saved = localStorage.getItem('fpl-my-team');
  if(saved) return saved;
  return data.your_league_entry_id != null ? String(data.your_league_entry_id) : null;
}

function computeNextFixtureFor(data, leId){
  if(leId == null) return null;
  const events = Object.keys(data.fixtures_by_event).map(Number).sort((a,b) => a-b);
  const probes = [data.current_event, data.next_event, ...events].filter(e => e != null);
  for(const ev of probes){
    const fixtures = data.fixtures_by_event[String(ev)] || [];
    const match = fixtures.find(f =>
      String(f.home.league_entry_id) === String(leId) || String(f.away.league_entry_id) === String(leId));
    if(match) return { event: ev, ...match };
  }
  return null;
}

function computeUpcomingFixturesFor(data, leId, count){
  if(leId == null) return [];
  const events = Object.keys(data.fixtures_by_event).map(Number).sort((a,b) => a-b);
  const from = data.current_event ?? Math.min(...events);
  const upcomingEvents = events.filter(e => e >= from);
  const results = [];
  for(const ev of upcomingEvents){
    const fixtures = data.fixtures_by_event[String(ev)] || [];
    const match = fixtures.find(f =>
      String(f.home.league_entry_id) === String(leId) || String(f.away.league_entry_id) === String(leId));
    if(match){
      results.push({ event: ev, ...match });
      if(results.length >= count) break;
    }
  }
  return results;
}

function rankChangeTag(row){
  if(row.last_rank == null || row.rank == null) return '';
  const diff = row.last_rank - row.rank; // positive = moved up since last gameweek
  if(diff > 0) return `<span class="rank-change up" title="Up ${diff} since last gameweek">&#9650;${diff}</span>`;
  if(diff < 0) return `<span class="rank-change down" title="Down ${-diff} since last gameweek">&#9660;${-diff}</span>`;
  return `<span class="rank-change same" title="No change since last gameweek">&#8212;</span>`;
}

function findStarPlayer(data, leId){
  const squad = data.latest_squads && data.latest_squads[String(leId)];
  if(!squad) return null;
  const all = [...squad.starting, ...squad.bench];
  if(all.length === 0) return null;
  return all.reduce((best, p) => (p.points > (best ? best.points : -Infinity)) ? p : best, null);
}

function render(data){
  DASHBOARD_DATA = data;
  document.getElementById('league-name').textContent = data.league.name || 'Draft League';
  document.getElementById('scoring-format').textContent =
    data.league.scoring === 'c' ? 'Classic scoring draft league' : 'Head-to-head draft league';
  document.getElementById('gw-value').textContent = data.current_event ? 'GW ' + data.current_event : '–';
  document.getElementById('gw-sub').textContent = data.next_deadline
    ? formatMelbourne(data.next_deadline)
    : '';
  startCountdown(data.next_deadline);
  document.getElementById('last-updated').textContent = 'Last updated ' + formatDate(data.generated_at);

  const app = document.getElementById('app');
  app.innerHTML = '';

  const myId = getMyTeamId(data);

  const viewAsWrap = document.createElement('div');
  viewAsWrap.className = 'view-as-bar';
  const sortedForSelect = [...data.standings].sort((a,b) => a.team_name.localeCompare(b.team_name));
  viewAsWrap.innerHTML = `
    <label for="view-as-select">Viewing as</label>
    <select id="view-as-select">
      <option value="">Pick your team…</option>
      ${sortedForSelect.map(r => `<option value="${r.league_entry_id}" ${String(r.league_entry_id)===String(myId)?'selected':''}>${r.team_name}</option>`).join('')}
    </select>
  `;
  viewAsWrap.querySelector('#view-as-select').addEventListener('change', (e) => {
    if(e.target.value){
      localStorage.setItem('fpl-my-team', e.target.value);
    }else{
      localStorage.removeItem('fpl-my-team');
    }
    render(data);
  });
  app.appendChild(viewAsWrap);

  const tabsWrap = document.createElement('div');
  tabsWrap.className = 'tabs';
  const panelsWrap = document.createElement('div');

  const panelBuilders = {
    table: () => {
      const wrap = document.createElement('div');
      const currentFixturePanel = buildCurrentFixturePanel(data, myId);
      if(currentFixturePanel) wrap.appendChild(currentFixturePanel);
      const grid = document.createElement('div');
      grid.className = 'grid';
      grid.appendChild(buildStandingsPanel(data, myId));
      grid.appendChild(buildSpotlightPanel(data, myId));
      wrap.appendChild(grid);
      const secondGrid = document.createElement('div');
      secondGrid.className = 'grid';
      secondGrid.style.marginTop = '0';
      secondGrid.appendChild(buildStreaksPanel(data));
      secondGrid.appendChild(buildInFormPanel(data));
      wrap.appendChild(secondGrid);
      wrap.appendChild(buildWaiversClearedPanel(data));
      wrap.appendChild(buildProgressionPanel(data));
      return wrap;
    },
    standings: () => {
      const wrap = document.createElement('div');
      wrap.appendChild(buildStandingsPanel(data, myId));
      return wrap;
    },
    fixtures: () => buildFixturesPanel(data),
    squads: () => buildSquadsPanel(data),
    draft: () => buildDraftRecapPanel(data),
    playoffs: () => buildPlayoffsPanel(data),
    golden: () => buildGoldenPanel(data),
    prizes: () => buildPrizesPanel(data),
    waivers: () => buildWaiversPanel(data),
  };

  // On narrow screens the full tab bar wraps awkwardly, so only these show
  // directly; everything else collapses into a "More" dropdown. Desktop
  // still shows all tabs inline via the media query in the CSS.
  const PRIMARY_TAB_IDS = ['table', 'fixtures', 'squads', 'golden'];
  const primaryTabs = TABS.filter(t => PRIMARY_TAB_IDS.includes(t.id));
  const moreTabs = TABS.filter(t => !PRIMARY_TAB_IDS.includes(t.id));

  function activateTab(tabId){
    tabsWrap.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    const directBtn = tabsWrap.querySelector(`.tab-btn[data-tab="${tabId}"]`);
    if(directBtn) directBtn.classList.add('active');
    moreMenu.querySelectorAll('.more-menu-item').forEach(b => b.classList.remove('active'));
    const moreItem = moreMenu.querySelector(`.more-menu-item[data-tab="${tabId}"]`);
    if(moreItem){
      moreItem.classList.add('active');
      moreBtn.classList.add('active');
    }else{
      moreBtn.classList.remove('active');
    }
    panelsWrap.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    document.getElementById('panel-' + tabId).classList.add('active');
    moreMenu.classList.remove('open');
  }

  primaryTabs.forEach((t, i) => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (i === 0 ? ' active' : '');
    btn.textContent = t.label;
    btn.dataset.tab = t.id;
    btn.addEventListener('click', () => activateTab(t.id));
    tabsWrap.appendChild(btn);
  });

  const moreWrap = document.createElement('div');
  moreWrap.className = 'more-tab-wrap';
  const moreBtn = document.createElement('button');
  moreBtn.className = 'tab-btn more-tab-btn';
  moreBtn.textContent = 'More \u25be';
  const moreMenu = document.createElement('div');
  moreMenu.className = 'more-menu';
  moreTabs.forEach(t => {
    const item = document.createElement('button');
    item.className = 'more-menu-item';
    item.textContent = t.label;
    item.dataset.tab = t.id;
    item.addEventListener('click', () => activateTab(t.id));
    moreMenu.appendChild(item);
  });
  moreBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    moreMenu.classList.toggle('open');
  });
  document.addEventListener('click', () => moreMenu.classList.remove('open'));
  moreWrap.appendChild(moreBtn);
  moreWrap.appendChild(moreMenu);
  tabsWrap.appendChild(moreWrap);

  TABS.forEach((t, i) => {
    const panel = document.createElement('div');
    panel.className = 'tab-panel' + (i === 0 ? ' active' : '');
    panel.id = 'panel-' + t.id;
    panel.appendChild(panelBuilders[t.id]());
    panelsWrap.appendChild(panel);
  });

  app.appendChild(tabsWrap);
  app.appendChild(panelsWrap);
}

function buildCurrentFixturePanel(data, myId){
  if(myId == null || !data.current_event) return null;

  const f = fixtures.find(fx =>
    String(fx.home.league_entry_id) === String(myId) || String(fx.away.league_entry_id) === String(myId));

  panel.className = 'panel';

function buildStandingsPanel(data, myId){
  const panel = document.createElement('div');
  panel.className = 'panel';
  panel.innerHTML = `

      <button class="expand-btn" id="standings-toggle">+ Full table</button>
    </div>
  `;

  const lastRank = Math.max(...data.standings.map(r => r.rank || 0));
  const midGameweek = !data.current_event_finished;

  // ---------- Compact view ----------
  const compactWrap = document.createElement('div');
  compactWrap.innerHTML = `
    <div class="standing-header">
      <span></span><span>Team</span>
      <span title="Won-Drawn-Lost">W-D-L</span>
      <span title="Total points, including this gameweek's live score so far">Pts</span>
      <span title="League points">League</span>

  list.className = 'standings-list';

    const classes = ['standing-row'];

    if(row.rank === 1 || row.rank === 2) classes.push('tier-strong');
    else if(row.rank === 3 || row.rank === 4) classes.push('tier-soft');
    const medal = row.rank === 1 ? ' \u{1F451}' : (row.rank === lastRank ? ' \u{1F4A9}' : '');
    const gwScore = row.current_gw_score;
    const showGwBracket = midGameweek && gwScore != null;
    // Fold this gameweek's live score into the headline total once it's
    // underway, but still flag it separately in the green bracket.
    const displayTotal = (row.points_for ?? 0) + (showGwBracket ? gwScore : 0);
    const gwBracket = showGwBracket ? ` <span class="diff pos">(+${gwScore})</span>` : '';
    const rankChange = rankChangeTag(row);

    const item = document.createElement('div');
    item.className = classes.join(' ');
    item.dataset.leId = row.league_entry_id;
    const teamDetail = computeTeamDetailSlim(data, row.league_entry_id);
    if(teamDetail) item.dataset.team = JSON.stringify(teamDetail);
    item.innerHTML = `
      <div class="standing-main">
        <span class="rank">${row.rank ?? '–'}${medal}${rankChange}</span>
        <div class="team-cell">
          <div class="name">${row.team_name}</div>
          <div class="manager">${row.manager_name}</div>
        </div>
        <span class="standing-record">${row.won}-${row.drawn}-${row.lost}</span>
        <span class="standing-pf">${displayTotal}${gwBracket}</span>
        <span class="standing-pts">${row.total ?? 0}</span>
      </div>
    `;
    list.appendChild(item);
  });
  compactWrap.appendChild(list);
  panel.appendChild(compactWrap);

  // ---------- Full table (classic layout) ----------
  const fullWrap = document.createElement('div');
  fullWrap.className = 'standings-full';
  fullWrap.style.display = 'none';
  const tableInner = document.createElement('div');
  tableInner.style.cssText = 'overflow-x:auto;';
  const table = document.createElement('table');
  table.innerHTML = `
    <thead>
      <tr>
        <th></th><th>Team</th><th class="num">W</th><th class="num">D</th>
        <th class="num">L</th><th class="num">PF</th><th class="num">PA</th><th class="num">Pts</th>
        <th style="text-align:right;">Form</th>
      </tr>
    </thead>
    <tbody>
      ${data.standings.map(row => {
        const classes = [];
        if(myId != null && String(row.league_entry_id) === String(myId)) classes.push('you');
        if(row.rank === 1 || row.rank === 2) classes.push('tier-strong');
        else if(row.rank === 3 || row.rank === 4) classes.push('tier-soft');
        const medal = row.rank === 1 ? ' \u{1F451}' : (row.rank === lastRank ? ' \u{1F4A9}' : '');
        return `
          <tr class="${classes.join(' ')}">
            <td class="rank">${row.rank ?? '–'}${medal}</td>
            <td class="team-cell"><div class="name">${row.team_name}</div><div class="manager">${row.manager_name}</div></td>
            <td class="num">${row.won ?? 0}</td>
            <td class="num">${row.drawn ?? 0}</td>
            <td class="num">${row.lost ?? 0}</td>
            <td class="num">${row.points_for ?? 0}</td>
            <td class="num">${row.points_against ?? 0}</td>
            <td class="pts">${row.total ?? 0}</td>
            <td>${formChips(row.form)}</td>
          </tr>
        `;
      }).join('')}
    </tbody>
  `;

  fullWrap.appendChild(tableInner);
  panel.appendChild(fullWrap);

  const toggleBtn = panel.querySelector('#standings-toggle');
  toggleBtn.addEventListener('click', () => {
    const showFull = fullWrap.style.display === 'none';
    fullWrap.style.display = showFull ? '' : 'none';
    compactWrap.style.display = showFull ? 'none' : '';
    toggleBtn.textContent = showFull ? '– Full table' : '+ Full table';
  });

  const legend = document.createElement('p');
  legend.style.cssText = 'font-size:11px;color:var(--chalk-dim);margin:10px 0 0;';
  legend.textContent = 'Top 2 go straight through to the final four; 3rd–4th also make the playoffs.';
  panel.appendChild(legend);
  return panel;
}

function playerRow(p){
  const badges = [];
  if(p.is_captain) badges.push('<span class="cap-badge">C</span>');
  if(p.is_vice_captain) badges.push('<span class="cap-badge vc">VC</span>');
  if(p.subbed_in) badges.push('<span class="cap-badge sub-badge" title="Auto-subbed in">&#8593;</span>');
  if(p.subbed_out) badges.push('<span class="cap-badge sub-badge out" title="Auto-subbed out (did not play)">&#8595;</span>');
  const icons = [];
  if(p.goals > 0) icons.push(`<span class="stat-icon goal" title="${p.goals} goal${p.goals>1?'s':''}">G${p.goals>1?'&times;'+p.goals:''}</span>`);
  if(p.assists > 0) icons.push(`<span class="stat-icon assist" title="${p.assists} assist${p.assists>1?'s':''}">A${p.assists>1?'&times;'+p.assists:''}</span>`);
  if(p.clean_sheet) icons.push(`<span class="stat-icon cs" title="Clean sheet">CS</span>`);
  if(p.defensive_contribution) icons.push(`<span class="stat-icon dc" title="Defensive contribution bonus">DC</span>`);
  if(p.bonus > 0) icons.push(`<span class="stat-icon bonus" title="${p.bonus} bonus point${p.bonus>1?'s':''}">B${p.bonus}</span>`);
  if(p.yellow_card) icons.push(`<span class="stat-icon yellow" title="Yellow card">&#9632;</span>`);
  if(p.red_card) icons.push(`<span class="stat-icon red" title="Red card">&#9632;</span>`);
  const colors = POSITION_COLORS[p.position] || { bg: 'transparent', dot: 'var(--chalk-dim)' };
  const didNotPlay = p.minutes === 0;
  const ptsDisplay = didNotPlay ? (p.match_finished ? 'DNP' : '&ndash;') : p.points;
  // Only show the upcoming-opponent tag if they haven't played yet AND their
  // match hasn't finished - once it's over, "DNP" (above) says it plainly.
  let oppTag = '';
  if(didNotPlay && !p.match_finished && p.opponents && p.opponents.length){
    oppTag = p.opponents.map(o => {
      const code = o.is_home ? o.opponent.toUpperCase() : o.opponent.toLowerCase();
      return `<span class="opp-tag" title="${o.is_home ? 'Home' : 'Away'} vs ${o.opponent}">${code}</span>`;
    }).join('');
  }
  return `
    <div class="squad-row" style="background:${colors.bg};border-left:3px solid ${colors.dot};${didNotPlay ? 'opacity:0.7;' : ''}" ${playerDataAttr(p)}>
      <span class="squad-name">${p.name}${badges.join('')}${oppTag}</span>
      <span class="squad-icons">${icons.join('')}</span>
      <span class="squad-pts">${ptsDisplay}</span>
    </div>
  `;
}

const POSITION_ORDER = { GKP: 0, DEF: 1, MID: 2, FWD: 3 };
function byPosition(list){
  return [...list].sort((a,b) => (POSITION_ORDER[a.position] ?? 9) - (POSITION_ORDER[b.position] ?? 9));
}

// Bench order otherwise preserves real substitute priority (important for
// auto-sub display) - but the reserve keeper should always visually lead
// the row, matching how FPL itself displays it, regardless of pick order.
function benchOrder(list){
  return [...list.filter(p => p.position === 'GKP'), ...list.filter(p => p.position !== 'GKP')];
}

// Net points the auto-subbed-in players contributed, shown on the "Subs"
// heading itself (e.g. "Subs +12") rather than on each individual card.
function benchLabel(squad){
  const subsPoints = squad.starting
    .filter(p => p.subbed_in)
    .reduce((sum, p) => sum + (p.points || 0), 0);
  return subsPoints > 0 ? `Subs +${subsPoints}` : 'Subs';
}

function squadColumn(label, squad){
  if(!squad){
    return `<div class="squad-col"><div class="squad-col-label">${label}</div><p style="font-size:12px;color:var(--chalk-dim);">No squad data for this gameweek.</p></div>`;
  }
  return `
    <div class="squad-col">
      <div class="squad-col-label">${label}</div>
      ${byPosition(squad.starting).map(playerRow).join('')}
      ${squad.bench.length ? `<div class="squad-bench-label">${benchLabel(squad)}</div>${benchOrder(squad.bench).map(playerRow).join('')}` : ''}
    </div>
  `;
}

  if(!f || (!f.most && !f.least)){
    panel.innerHTML += `<p style="color:var(--chalk-dim);font-size:13px;">Not enough finished gameweeks yet.</p>`;

  }
  const resultChips = (results) => results.map(r => `<span class="chip ${r}" style="width:16px;height:16px;font-size:9px;display:inline-flex;">${r}</span>`).join(' ');
  const rows = [];
  if(f.most){
    rows.push(`
      <div class="streak-row">

        <div><div class="streak-name">${f.most.team_name}</div>
        <div class="streak-sub">Last ${f.most.games_counted} games: ${resultChips(f.most.results)}</div></div>
      </div>

  }
  if(f.least && f.least.league_entry_id !== (f.most && f.most.league_entry_id)){
    rows.push(`
      <div class="streak-row">
        <span class="streak-icon cold">&#10052;&#65039;</span>
        <div><div class="streak-name">${f.least.team_name}</div>
        <div class="streak-sub">Last ${f.least.games_counted} games: ${resultChips(f.least.results)}</div></div>

// Embeds the subset of a player's stats needed for the points-receipt
// popover as a safely-escaped HTML attribute, so a single delegated click
// listener can read it back out regardless of which view rendered the card.
function playerDataAttr(p){
  const slim = {
    name: p.name, position: p.position, minutes: p.minutes, goals: p.goals,
    assists: p.assists, clean_sheet: p.clean_sheet, defensive_contribution: p.defensive_contribution,
    defensive_contribution_count: p.defensive_contribution_count,
    goals_conceded: p.goals_conceded, own_goals: p.own_goals, yellow_card: p.yellow_card,
    red_card: p.red_card, bonus: p.bonus, points: p.points, base_points: p.base_points,
    is_captain: p.is_captain, is_vice_captain: p.is_vice_captain, photo_url: p.photo_url,
    saves: p.saves, xg: p.xg, xa: p.xa, xgi: p.xgi, match_finished: p.match_finished,
    subbed_in: p.subbed_in, subbed_out: p.subbed_out, club: p.club, opponents: p.opponents,
    acquisition: findAcquisitionInfo(p.name),
    badges: p.badges, form: p.form,
  };
  return `data-player="${JSON.stringify(slim).replace(/"/g, '&quot;')}"`;
}

// Standard Fantasy Premier League scoring, used to build an approximate
// points breakdown for the receipt popover. The total shown always comes
// from the API directly (base_points/points) rather than a sum of these -
// this table is just for explaining the number, not calculating it, since
// scoring specifics can occasionally shift season to season.
const GOAL_POINTS = { GKP: 6, DEF: 6, MID: 5, FWD: 4 };
const CLEAN_SHEET_POINTS = { GKP: 4, DEF: 4, MID: 1, FWD: 0 };

function buildReceiptLines(p){
  const lines = [];
  if(p.minutes === 0 && !p.match_finished){
    lines.push([`Hasn't played yet`, 0]);
  }else if(p.minutes === 0 && p.match_finished){
    lines.push([`Did not play (match finished)`, 0]);
  }else{
    lines.push([`Minutes played: ${p.minutes}'`, p.minutes >= 60 ? 2 : (p.minutes > 0 ? 1 : 0)]);
  }
  if(p.goals > 0) lines.push([`Goal${p.goals>1?'s':''}: ${p.goals}`, p.goals * (GOAL_POINTS[p.position] ?? 4)]);
  if(p.assists > 0) lines.push([`Assist${p.assists>1?'s':''}: ${p.assists}`, p.assists * 3]);
  if(p.clean_sheet) lines.push([`Clean sheet`, CLEAN_SHEET_POINTS[p.position] ?? 0]);
  // Only surface goals conceded once it actually costs a point (every 2
  // conceded = -1) - showing "1 conceded, 0 pts" is just noise.
  if(p.goals_conceded >= 2 && (p.position === 'GKP' || p.position === 'DEF')){
    lines.push([`Goals conceded: ${p.goals_conceded}`, -Math.floor(p.goals_conceded / 2)]);
  }
  if(p.saves > 0 && p.position === 'GKP'){
    lines.push([`Saves: ${p.saves}`, Math.floor(p.saves / 3)]);
  }
  if(p.defensive_contribution) lines.push([`Defensive contribution: ${p.defensive_contribution_count ?? ''}`, 2]);
  if(p.own_goals > 0) lines.push([`Own goal${p.own_goals>1?'s':''}: ${p.own_goals}`, p.own_goals * -2]);
  if(p.red_card) lines.push([`Red card`, -3]);
  else if(p.yellow_card) lines.push([`Yellow card`, -1]);
  if(p.bonus > 0) lines.push([`Bonus`, p.bonus]);
  return lines;
}

function buildFixtureResultHTML(p){
  if(!p.opponents || !p.opponents.length) return '';
  return `
    <div class="receipt-fixture">
      ${p.opponents.map(o => {
        const hasScore = o.team_score != null && o.opponent_score != null;
        const teamCode = (p.club || '').toUpperCase();
        const oppCode = (o.opponent || '').toUpperCase();
        const home = teamCode, away = oppCode;
        const homeScore = o.is_home ? o.team_score : o.opponent_score;
        const awayScore = o.is_home ? o.opponent_score : o.team_score;
        return hasScore
          ? `<div class="receipt-fixture-row"><span>${home}</span><strong>${homeScore} - ${awayScore}</strong><span>${away}</span></div>`
          : `<div class="receipt-fixture-row"><span>${teamCode}</span><strong>vs</strong><span>${oppCode} (${o.is_home ? 'H' : 'A'})</span></div>`;
      }).join('')}

}

function buildBadgesHTML(p){
  if(!p.badges || !p.badges.length) return '';

function buildFormHTML(p){

function buildAcquisitionHTML(p){

// Set once per render() call so per-player helpers (which only ever receive
// the player row itself, not the whole dataset) can still cross-reference
// draft_picks / accepted_transactions for acquisition history.
let DASHBOARD_DATA = null;

function findAcquisitionInfo(playerName){
  if(!DASHBOARD_DATA || !playerName) return null;
  const numTeams = (DASHBOARD_DATA.standings || []).length || 1;
  const draftPick = (DASHBOARD_DATA.draft_picks || []).find(p => p.player_name === playerName);
  if(draftPick && draftPick.round != null && draftPick.pick != null){
    const overall = (draftPick.round - 1) * numTeams + draftPick.pick;
    return { type: 'drafted', round: draftPick.round, pick: draftPick.pick, overall };
  }
  // Not originally drafted (or drafted by a team they've since left) - fall
  // back to their most recent acquisition via waiver/free agent/trade.
  const moves = (DASHBOARD_DATA.accepted_transactions || [])
    .filter(t => t.player_in === playerName)
    .sort((a,b) => (b.event ?? 0) - (a.event ?? 0));
  if(moves.length){
    return { type: 'signed', event: moves[0].event, kind: moves[0].kind };
  }
  return null;
}

function computeTeamDetail(data, leId){
  const row = data.standings.find(r => String(r.league_entry_id) === String(leId));
  if(!row) return null;
  const squad = data.latest_squads && data.latest_squads[String(leId)];
  const allPlayers = squad ? [...squad.starting, ...squad.bench] : [];

  // Current gameweek's H2H fixture (both scores + opponent), so the score
  // line can show the actual matchup and be colour-coded by result. If the
  // current gameweek's own fixture hasn't started yet, fall back to the
  // most recently FINISHED gameweek instead, labelled as "Last result"
  // rather than an in-progress "current" score.
  function fixtureInfoFor(f, leId, ev){
    const isHome = String(f.home.league_entry_id) === String(leId);
    const own = isHome ? f.home : f.away;
    const opp = isHome ? f.away : f.home;
    if(own.score == null || opp.score == null) return null;
    return {
      event: ev,
      opponent: opp.team_name,
      own_score: own.score, opp_score: opp.score,
      result: own.score > opp.score ? 'win' : (own.score < opp.score ? 'loss' : 'draw'),
    };
  }

  let currentFixtureInfo = null;
  let isLastResult = false;
  const currentFixtures = data.fixtures_by_event[String(data.current_event)] || [];
  const currentFixture = currentFixtures.find(f =>
    String(f.home.league_entry_id) === String(leId) || String(f.away.league_entry_id) === String(leId));

  if(currentFixture && currentFixture.started){
    currentFixtureInfo = fixtureInfoFor(currentFixture, leId, data.current_event);
    isLastResult = !!currentFixture.finished;
  }else{
    // Current gameweek hasn't kicked off yet - look backwards for the most
    // recent gameweek that has actually finished.
    const events = Object.keys(data.fixtures_by_event).map(Number)
      .filter(e => data.current_event == null || e < data.current_event)
      .sort((a,b) => b - a);
    for(const ev of events){
      const fixtures = data.fixtures_by_event[String(ev)] || [];
      const match = fixtures.find(f =>
        String(f.home.league_entry_id) === String(leId) || String(f.away.league_entry_id) === String(leId));
      if(match && match.finished){
        currentFixtureInfo = fixtureInfoFor(match, leId, ev);
        isLastResult = true;
        break;
      }
    }
  }

  const seasonStar = allPlayers.length
    ? allPlayers.reduce((best, p) => (p.season_points || 0) > (best.season_points || 0) ? p : best)
    : null;

  const captain = squad ? squad.starting.find(p => p.is_captain) : null;

  const teamPicks = (data.draft_picks || [])
    .filter(p => String(p.league_entry_id) === String(leId))
    .sort((a,b) => (a.round ?? 0) - (b.round ?? 0));
  const currentNames = new Set(allPlayers.map(p => p.name));
  const firstPickStillOwned = teamPicks.find(p => currentNames.has(p.player_name)) || null;

  const upcoming = computeUpcomingFixturesFor(data, leId, 4).slice(1);

  return { row, seasonStar, captain, firstPickStillOwned, upcoming, currentFixtureInfo, isLastResult };
}

// Same pattern as the player receipt: compute everything needed while `data`
// is in scope at render time, embed it as a dataset attribute, then a single
// delegated click listener reads it back out - works regardless of which
// tab/panel rendered the row.
function computeTeamDetailSlim(data, leId){
  const detail = computeTeamDetail(data, leId);
  if(!detail) return null;
  return {
    team_name: detail.row.team_name,
    manager_name: detail.row.manager_name,
    won: detail.row.won, drawn: detail.row.drawn, lost: detail.row.lost,
    rank: detail.row.rank,
    mid_gameweek: !data.current_event_finished,
    current_event: data.current_event,
    current_gw_score: detail.row.current_gw_score,
    season_star_name: detail.seasonStar ? detail.seasonStar.name : null,
    season_star_points: detail.seasonStar ? (detail.seasonStar.season_points ?? 0) : null,
    captain_name: detail.captain ? detail.captain.name : null,
    captain_points: detail.captain ? detail.captain.points : null,
    first_pick_name: detail.firstPickStillOwned ? detail.firstPickStillOwned.player_name : null,
    first_pick_round: detail.firstPickStillOwned ? detail.firstPickStillOwned.round : null,
    current_fixture: detail.currentFixtureInfo,
    is_last_result: detail.isLastResult,
    upcoming: detail.upcoming.map(f => {
      const isHome = String(f.home.league_entry_id) === String(leId);
      const opp = isHome ? f.away : f.home;
      return { event: f.event, opponent: opp.team_name, is_home: isHome };
    }),
  };
}

function toggleTeamDetailDropdown(row, t){
  const existingNext = row.nextElementSibling;
  if(existingNext && existingNext.classList.contains('team-detail-dropdown')){
    // Already open for this row - toggle closed.
    existingNext.remove();
    row.classList.remove('expanded');
    return;
  }
  // Close any other open dropdown before opening this one.
  document.querySelectorAll('.team-detail-dropdown').forEach(el => el.remove());
  document.querySelectorAll('.standing-row.expanded').forEach(el => el.classList.remove('expanded'));

  const dropdown = document.createElement('div');
  dropdown.className = 'team-detail-dropdown';
  dropdown.innerHTML = teamDetailContentHTML(t);
  row.after(dropdown);
  row.classList.add('expanded');
}

document.addEventListener('click', (e) => {
  const teamRow = e.target.closest('.standing-row');
  if(teamRow && teamRow.dataset.team){
    try{ toggleTeamDetailDropdown(teamRow, JSON.parse(teamRow.dataset.team)); }catch(err){ /* ignore */ }
    return;
  }
  const card = e.target.closest('.field-player, .squad-row');
  if(!card || !card.dataset.player) return;
  try{
    showPlayerReceipt(JSON.parse(card.dataset.player));
  }catch(err){ /* malformed data, ignore */ }
});

function fieldPlayerCard(p){
  const didNotPlay = p.minutes === 0;
  let subLabel;
  if(didNotPlay && !p.match_finished && p.opponents && p.opponents.length){
    // Hasn't kicked off yet - show their upcoming fixture instead of a blank dash.
    subLabel = p.opponents.map(o =>
      `${o.is_home ? o.opponent.toUpperCase() : o.opponent.toLowerCase()} (${o.is_home ? 'H' : 'A'})`
    ).join(', ');
  }else if(didNotPlay && p.match_finished){
    // Match is over and they genuinely didn't feature.
    subLabel = 'DNP';
  }else if(didNotPlay){
    subLabel = '–';
  }else{
    subLabel = String(p.points);
  }
  const capTag = p.is_captain ? '<span class="field-cap">C</span>' : (p.is_vice_captain ? '<span class="field-cap vc">VC</span>' : '');
  const subTag = p.subbed_in
    ? '<span class="field-sub-tag on" title="Auto-subbed on">&#8593;</span>'
    : (p.subbed_out ? '<span class="field-sub-tag off" title="Auto-subbed off">&#8595;</span>' : '');
  return `
    <div class="field-player" title="${p.name}${p.subbed_in ? ' (auto-subbed in)' : ''} - tap for details" ${playerDataAttr(p)}>
      <div class="field-photo">
        ${p.photo_url
          ? `<img src="${p.photo_url}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='block';">`
          : ''}
        <img class="field-jersey-fallback" src="icons/player-placeholder.png" alt="" style="display:${p.photo_url ? 'none' : 'block'};">
        ${capTag}
        ${subTag}
      </div>
      <div class="field-pill">
        <div class="field-name" style="${didNotPlay ? 'opacity:0.7;' : ''}">${p.name}</div>
        <div class="field-pts">${subLabel}</div>
      </div>
    </div>
  `;
}

function pitchColumn(teamName, squad, showLabel, score){
  if(showLabel === undefined) showLabel = true;
  const labelHTML = score != null
    ? `<div class="pitch-team-label">${teamName} <span class="pitch-team-score">${score}</span></div>`
    : `<div class="pitch-team-label">${teamName}</div>`;
  if(!squad){
    return `<div class="pitch-col">${showLabel ? labelHTML : ''}<p style="color:rgba(255,255,255,0.7);font-size:12px;text-align:center;">No squad data yet.</p></div>`;
  }
  const rows = { GKP: [], DEF: [], MID: [], FWD: [] };
  squad.starting.forEach(p => { (rows[p.position] || rows.MID).push(p); });
  return `
    <div class="pitch-col">
      ${showLabel ? labelHTML : ''}
      <div class="pitch">
        ${PITCH_LINES_SVG}
        <div class="pitch-rows">
          ${['GKP','DEF','MID','FWD'].map(pos => rows[pos].length
            ? `<div class="pitch-row">${rows[pos].map(fieldPlayerCard).join('')}</div>` : '').join('')}
        </div>
      </div>
      ${squad.bench.length ? `
        <div class="squad-bench-label">${benchLabel(squad)}</div>
        <div class="pitch-bench-row">${benchOrder(squad.bench).map(fieldPlayerCard).join('')}</div>
      ` : ''}
    </div>
  `;
}

function matchupHeaderHTML(f){

function buildSquadsPanel(data){
  const panel = document.createElement('div');
  panel.className = 'panel';
  const gw = data.latest_squad_event;
  panel.innerHTML = `<h2><span class="dot"></span>Squads${gw ? ` &mdash; as of GW ${gw}` : ''}</h2>`;

  const squads = data.latest_squads || {};
  const ranked = [...data.standings].sort((a,b) => (a.rank ?? 999) - (b.rank ?? 999));

  if(Object.keys(squads).length === 0){
    panel.innerHTML += `<p style="color:var(--chalk-dim);font-size:13px;">No squad data available yet.</p>`;
    return panel;
  }

  const viewWrap = document.createElement('div');
  viewWrap.className = 'gw-pills';
  viewWrap.style.marginBottom = '12px';
  const fieldBtn = document.createElement('button');
  fieldBtn.className = 'gw-pill active';
  fieldBtn.textContent = 'Field view';
  const listBtn = document.createElement('button');
  listBtn.className = 'gw-pill';
  listBtn.textContent = 'List view';
  viewWrap.appendChild(fieldBtn);
  viewWrap.appendChild(listBtn);
  panel.appendChild(viewWrap);

  const wrap = document.createElement('div');
  wrap.style.cssText = 'overflow-x:auto;';
  const grid = document.createElement('div');
  panel.appendChild(wrap);
  wrap.appendChild(grid);

  function render(mode){
    grid.style.cssText = mode === 'field'
      ? `display:grid;grid-template-columns:repeat(${ranked.length},minmax(300px,1fr));gap:12px;`
      : `display:grid;grid-template-columns:repeat(${ranked.length},minmax(160px,1fr));gap:14px;`;
    grid.innerHTML = ranked.map(r => {
      const squad = squads[String(r.league_entry_id)];
      const label = `#${r.rank} ${r.team_name}`;
      return mode === 'field' ? pitchColumn(label, squad) : squadColumn(label, squad);
    }).join('');
  }

  fieldBtn.addEventListener('click', () => {
    fieldBtn.classList.add('active'); listBtn.classList.remove('active');
    render('field');
  });
  listBtn.addEventListener('click', () => {
    listBtn.classList.add('active'); fieldBtn.classList.remove('active');
    render('list');
  });

  render('field');
  return panel;
}

// Tracks whichever fixture card is currently expanded (across the Fixtures

    const fieldBtn = card.querySelector('.view-switch-btn[data-mode="field"]');
    const listBtn = card.querySelector('.view-switch-btn[data-mode="list"]');
    const closeBtn = card.querySelector('.fixture-close-btn');
    let mode = 'field';
    let isOpen = false;

    function renderContent(){
      content.innerHTML = mode === 'field'
        ? fieldMatchup(f)
        : `<div class="squad-grid">
            ${squadColumn(f.home.team_name, f.squads[String(f.home.league_entry_id)])}
            ${squadColumn(f.away.team_name, f.squads[String(f.away.league_entry_id)])}
          </div>`;
      fieldBtn.classList.toggle('active', mode === 'field');
      listBtn.classList.toggle('active', mode === 'list');
    }

    function closeCard(){
      isOpen = false;
      area.classList.remove('open');
      card.classList.remove('fixture-card-expanded');
      hint.innerHTML = '&#9662; Expand';
      if(openCardCloser === closeCard) openCardCloser = null;
    }

    function openCard(){
      if(openCardCloser && openCardCloser !== closeCard) openCardCloser();
      isOpen = true;
      area.classList.add('open');
      card.classList.add('fixture-card-expanded');
      hint.innerHTML = '&#9652; Collapse';
      renderContent();
      openCardCloser = closeCard;
    }

    card.addEventListener('click', (e) => {
      if(e.target.closest('.view-switch-btn, .field-player, .squad-row, .fixture-close-btn')) return;
      isOpen ? closeCard() : openCard();
    });
    fieldBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if(mode !== 'field'){ mode = 'field'; renderContent(); }
    });
    listBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if(mode !== 'list'){ mode = 'list'; renderContent(); }
    });
    closeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      closeCard();
    });
  }
  return card;
}

function buildFixturesPanel(data){
  const panel = document.createElement('div');
  panel.className = 'panel';
  panel.style.marginBottom = '24px';
  panel.innerHTML = `<h2><span class="dot"></span>Fixtures &amp; results</h2>`;

  const gwKeys = Object.keys(data.fixtures_by_event).map(Number).sort((a,b) => a-b);
  // Whole card is clickable, opens straight to Field view by default; an
  // internal switch lets you flip to List without collapsing. Only one card
  // is open at a time (accordion) - openCardCloser (module-level, defined
  // above) tracks whichever card is currently expanded so a newly-opened
  // card can collapse it first.

  const modeWrap = document.createElement('div');
  modeWrap.className = 'gw-pills';
  modeWrap.style.marginBottom = '10px';
  const byGwBtn = document.createElement('button');
  byGwBtn.className = 'gw-pill active';
  byGwBtn.textContent = 'By gameweek';
  const byTeamBtn = document.createElement('button');
  byTeamBtn.className = 'gw-pill';
  byTeamBtn.textContent = 'By team';
  modeWrap.appendChild(byGwBtn);
  modeWrap.appendChild(byTeamBtn);

  const pillsWrap = document.createElement('div');
  pillsWrap.className = 'gw-pills';
  const teamSelectWrap = document.createElement('div');
  teamSelectWrap.style.cssText = 'margin-bottom:14px;display:none;';
  const sortedTeams = [...data.standings].sort((a,b) => a.team_name.localeCompare(b.team_name));
  teamSelectWrap.innerHTML = `
    <select id="fixtures-team-select" style="background:var(--card);border:1px solid var(--line);border-radius:8px;color:var(--chalk);padding:8px 12px;font-size:13px;">
      ${sortedTeams.map(t => `<option value="${t.league_entry_id}">${t.team_name}</option>`).join('')}
    </select>
  `;
  const listWrap = document.createElement('div');
  listWrap.className = 'fixture-list';

  function playedCountTag(f, side){
    const squad = f.squads && f.squads[String(side.league_entry_id)];
    if(!squad || squad.squad_size == null) return '';
    return `<span class="played-tag">${squad.played_count}/${squad.squad_size}</span>`;
  }

  function renderGw(gw){
    listWrap.innerHTML = '';
    const fixtures = data.fixtures_by_event[String(gw)] || [];
    fixtures.forEach(f => listWrap.appendChild(fixtureCard(f, false)));
  }

  function renderTeam(leId){
    listWrap.innerHTML = '';
    gwKeys.forEach(gw => {
      const fixtures = data.fixtures_by_event[String(gw)] || [];
      const match = fixtures.find(f =>
        String(f.home.league_entry_id) === String(leId) || String(f.away.league_entry_id) === String(leId));
      if(match) listWrap.appendChild(fixtureCard({ ...match, event: gw }, true));
    });
  }

  gwKeys.forEach(gw => {
    const pill = document.createElement('button');
    pill.className = 'gw-pill';
    pill.textContent = 'GW ' + gw;
    pill.addEventListener('click', () => {
      pillsWrap.querySelectorAll('.gw-pill').forEach(p => p.classList.remove('active'));
      pill.classList.add('active');
      renderGw(gw);
    });
    pillsWrap.appendChild(pill);
  });

  byGwBtn.addEventListener('click', () => {
    byGwBtn.classList.add('active');
    byTeamBtn.classList.remove('active');
    pillsWrap.style.display = '';
    teamSelectWrap.style.display = 'none';
    const activePill = pillsWrap.querySelector('.gw-pill.active') || pillsWrap.firstElementChild;
    if(activePill) renderGw(Number(activePill.textContent.replace('GW ', '')));
  });
  byTeamBtn.addEventListener('click', () => {
    byTeamBtn.classList.add('active');
    byGwBtn.classList.remove('active');
    pillsWrap.style.display = 'none';
    teamSelectWrap.style.display = '';
    renderTeam(teamSelectWrap.querySelector('select').value);
  });
  teamSelectWrap.querySelector('select').addEventListener('change', (e) => {
    renderTeam(e.target.value);
  });

  panel.appendChild(modeWrap);
  panel.appendChild(pillsWrap);
  panel.appendChild(teamSelectWrap);
  panel.appendChild(listWrap);

  const defaultGw = data.current_event && gwKeys.includes(data.current_event)
    ? data.current_event
    : gwKeys[gwKeys.length - 1];
  const defaultPill = [...pillsWrap.children].find(p => p.textContent === 'GW ' + defaultGw);
  if(defaultPill){ defaultPill.classList.add('active'); }
  if(defaultGw !== undefined) renderGw(defaultGw);

  return panel;
}

function buildProgressionPanel(data){
  const panel = document.createElement('div');
  panel.className = 'panel';
  panel.innerHTML = `<h2><span class="dot"></span>Points progression</h2>
    <div class="chart-wrap"><canvas id="progression-chart"></canvas></div>`;

  requestAnimationFrame(() => {
    const ctx = document.getElementById('progression-chart');
    const events = data.progression.events;
    const teamsObj = data.progression.teams;
    const yourLeId = data.your_league_entry_id;

    const palette = ['#6C3CE9','#E5484D','#F5A623','#1C63E8','#D6409F','#7A8C9E','#A67CF0','#2FA5A0','#C77DFF','#9C9BC0'];
    let colorIdx = 0;

    const datasets = Object.entries(teamsObj).map(([leId, t]) => {
      const isYou = String(yourLeId) === String(leId);
      const color = isYou ? '#F4B400' : palette[(colorIdx++) % palette.length];
      return {
        label: t.name,
        data: t.cumulative,
        borderColor: color,
        backgroundColor: color,
        borderWidth: isYou ? 3 : 1.5,
        pointRadius: isYou ? 3 : 0,
        tension: 0.25,
      };
    });

    const dimColor = getComputedStyle(document.documentElement).getPropertyValue('--chalk-dim').trim();
    const gridColor = getComputedStyle(document.documentElement).getPropertyValue('--line').trim();

    new Chart(ctx, {
      type: 'line',
      data: { labels: events.map(e => 'GW' + e), datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: 'nearest', intersect: false },
        plugins: {
          legend: { labels: { color: dimColor, font: { size: 11 } } },
        },
        scales: {
          x: { ticks: { color:dimColor }, grid: { color:gridColor } },
          y: { ticks: { color:dimColor }, grid: { color:gridColor } },
        }
      }
    });
  });

  return panel;
}

function matchRow({teamA, teamB, fixture, label, byeNote}){
  const played = fixture && fixture.finished && fixture.home.score !== null && fixture.away.score !== null;
  let winnerId = null;
  if(played){
    winnerId = fixture.home.score > fixture.away.score ? fixture.home.league_entry_id
             : fixture.away.score > fixture.home.score ? fixture.away.league_entry_id : null;
  }
  const nameA = teamA ? teamA.team_name : 'TBD';
  const nameB = teamB ? teamB.team_name : 'TBD';
  const idA = teamA ? teamA.league_entry_id : null;
  const idB = teamB ? teamB.league_entry_id : null;
  const dim = (id) => (winnerId && id !== winnerId) ? 'color:var(--chalk-dim);' : '';
  const div = document.createElement('div');
  div.className = 'fixture-card';
  div.style.marginBottom = '8px';
  div.innerHTML = `
    ${label ? `<div style="font-size:11px;color:var(--chalk-dim);margin-bottom:6px;">${label}</div>` : ''}
    <div class="fixture-row">
      <div class="side" style="${dim(idA)}">${nameA}</div>
      <div class="score">${played ? fixture.home.score : '–'}</div>
    </div>
    <div class="fixture-row">
      <div class="side" style="${dim(idB)}">${nameB}</div>
      <div class="score">${played ? fixture.away.score : '–'}</div>
    </div>
    ${byeNote ? `<div class="bye-note">${byeNote}</div>` : ''}
  `;
  return div;
}

const POSITION_COLORS = {
  FWD: { bg: 'rgba(229,72,77,0.14)', dot: '#E5484D', label: 'Forward' },
  MID: { bg: 'rgba(23,192,140,0.14)', dot: '#17C08C', label: 'Midfielder' },
  DEF: { bg: 'rgba(28,99,232,0.14)', dot: '#1C63E8', label: 'Defender' },
  GKP: { bg: 'rgba(244,180,0,0.16)', dot: '#C99A00', label: 'Goalkeeper' },
};

function buildDraftRecapPanel(data){
  const panel = document.createElement('div');
  panel.className = 'panel';
  panel.innerHTML = `<h2><span class="dot"></span>Draft recap</h2>`;

  const picks = data.draft_picks || [];
  if(picks.length === 0){
    const msg = document.createElement('p');
    msg.style.cssText = 'color:var(--chalk-dim);font-size:13px;';
    msg.textContent = 'No draft data available yet.';
    panel.appendChild(msg);
    return panel;
  }

  // Fixed column order: whichever team picked in each slot during the
  // earliest round (falls back to first-seen order for anyone missing it).
  const firstRound = Math.min(...picks.map(p => p.round ?? 1));
  const round1 = picks.filter(p => (p.round ?? 1) === firstRound);
  const columnOrder = [];
  const seen = new Set();
  [...round1, ...picks].forEach(p => {
    const key = String(p.league_entry_id ?? p.team_name);
    if(!seen.has(key)){ seen.add(key); columnOrder.push({ key, team_name: p.team_name, short_name: p.short_name }); }
  });

  const legend = document.createElement('div');
  legend.className = 'draft-legend';
  legend.innerHTML = Object.entries(POSITION_COLORS).map(([code, c]) => `
    <span class="draft-legend-item"><span class="draft-dot" style="background:${c.dot}"></span>${c.label}</span>
  `).join('');
  panel.appendChild(legend);

  const picksByTeam = {};
  columnOrder.forEach(c => picksByTeam[c.key] = []);
  picks.forEach(p => {
    const key = String(p.league_entry_id ?? p.team_name);
    if(picksByTeam[key]) picksByTeam[key].push(p);
  });
  Object.values(picksByTeam).forEach(list => list.sort((a,b) => (a.round ?? 0) - (b.round ?? 0)));

  const wrap = document.createElement('div');
  wrap.style.cssText = 'overflow-x:auto;';
  const grid = document.createElement('div');
  grid.style.cssText = `display:grid;grid-template-columns:repeat(${columnOrder.length},minmax(150px,1fr));gap:14px;`;
  grid.innerHTML = columnOrder.map(c => {
    const teamPicks = picksByTeam[c.key];
    const total = teamPicks.reduce((sum, p) => sum + (p.season_points || 0), 0);
    return `
      <div class="squad-col">
        <div class="squad-col-label">${c.team_name}</div>
        <div style="display:grid;grid-template-columns:26px 1fr 34px;font-size:9px;font-weight:700;color:var(--chalk-dim);text-transform:uppercase;padding:0 6px 4px;">
          <span></span><span></span><span style="text-align:right;">Pts</span>
        </div>
        ${teamPicks.map(p => {
          const colors = POSITION_COLORS[p.position] || { bg: 'transparent', dot: 'var(--chalk-dim)' };
          return `
            <div class="squad-row" style="background:${colors.bg};border-left:3px solid ${colors.dot};grid-template-columns:26px 1fr 34px;">
              <span class="draft-round">R${p.round}</span>
              <span class="squad-name">${p.player_name}</span>
              <span class="squad-pts">${p.season_points || 0}</span>
            </div>
          `;
        }).join('')}
        <div class="draft-total-row">
          <span>Total</span><span>${total}</span>
        </div>
      </div>
    `;
  }).join('');
  wrap.appendChild(grid);
  panel.appendChild(wrap);

  return panel;
}

function buildPlayoffsPanel(data){
  const panel = document.createElement('div');
  panel.className = 'panel';
  panel.innerHTML = `<h2><span class="dot"></span>Playoff bracket</h2>`;

  const p = data.playoffs;
  if(!p){
    const msg = document.createElement('p');
    msg.style.cssText = 'color:var(--chalk-dim);font-size:13px;';
    msg.textContent = 'The bracket seeds automatically once the regular season standings have at least 4 teams.';
    panel.appendChild(msg);
    return panel;
  }

  const semiLabel = document.createElement('div');
  semiLabel.className = 'bracket-round-label';
  semiLabel.textContent = `Semi-finals · GW${p.semi_gw}`;
  panel.appendChild(semiLabel);
  panel.appendChild(matchRow({teamA: p.semi_a.team_a, teamB: p.semi_a.team_b, fixture: p.semi_a.fixture}));
  panel.appendChild(matchRow({teamA: p.semi_b.team_a, teamB: p.semi_b.team_b, fixture: p.semi_b.fixture}));

  const elimLabel = document.createElement('div');
  elimLabel.className = 'bracket-round-label';
  elimLabel.textContent = `Elimination · GW${p.elim_gw}`;
  panel.appendChild(elimLabel);
  panel.appendChild(matchRow({
    teamA: p.elim.team_a, teamB: p.elim.team_b, fixture: p.elim.fixture,
    label: 'Loser of semi A vs winner of semi B',
    byeNote: p.semi_a_bye_to_final ? `${p.semi_a_bye_to_final.team_name} gets a bye straight to the final.` : null,
  }));

  const finalLabel = document.createElement('div');
  finalLabel.className = 'bracket-round-label';
  finalLabel.textContent = `Final · GW${p.final_gw}`;
  panel.appendChild(finalLabel);
  panel.appendChild(matchRow({teamA: p.final.team_a, teamB: p.final.team_b, fixture: p.final.fixture}));

  if(p.final_winner){
    const banner = document.createElement('div');
    banner.className = 'champion-banner';
    banner.innerHTML = `<i class="ti ti-trophy" aria-hidden="true"></i> ${p.final_winner.team_name} wins the league`;
    panel.appendChild(banner);
  }

  return panel;
}

function buildGoldenPanel(data){
  const panel = document.createElement('div');
  panel.className = 'panel';
  const g = data.golden_gameweek;
  panel.innerHTML = `<h2><span class="dot"></span>Golden gameweek prize</h2>
    <p style="font-size:12px;color:var(--chalk-dim);margin-top:-8px;">
      Highest single-gameweek score across the whole season (GW1–${g ? g.season_end : '–'}). One score per team, best gameweek only.
    </p>`;

  if(!g || !g.leader){
    const msg = document.createElement('p');
    msg.style.cssText = 'color:var(--chalk-dim);font-size:13px;';
    msg.textContent = 'Scores will appear here once the season is underway.';
    panel.appendChild(msg);
    return panel;
  }

  const leaderDiv = document.createElement('div');
  leaderDiv.className = 'golden-leader';
  const leaders = (g.leaders && g.leaders.length) ? g.leaders : [g.leader];
  const isTie = leaders.length > 1;
  leaderDiv.innerHTML = `
    <div class="label">${isTie ? `Tied for the lead (${leaders.length})` : 'Current leader'}</div>
    ${leaders.map(l => `<div class="value">${l.team_name} &middot; ${l.points} pts (GW${l.event})</div>`).join('')}
  `;
  panel.appendChild(leaderDiv);

  const tableWrap = document.createElement('div');
  tableWrap.style.cssText = 'overflow-x:auto;';
  const table = document.createElement('table');
  table.style.minWidth = 'unset';
  table.innerHTML = `
    <thead><tr>
      <th style="width:28px;"></th><th>Team</th>
      <th class="num" style="width:50px;">GW</th><th class="num" style="width:50px;">Pts</th>
    </tr></thead>
    <tbody>${g.leaderboard.map((r, i) => `
      <tr>
        <td class="rank">${i + 1}</td>
        <td>${r.team_name}</td>
        <td class="num">${r.event}</td>
        <td class="pts">${r.points}</td>
      </tr>
    `).join('')}</tbody>
  `;
  tableWrap.appendChild(table);
  panel.appendChild(tableWrap);
  return panel;
}

function buildWaiversPanel(data){
  const panel = document.createElement('div');
  panel.className = 'panel';
  panel.innerHTML = `<h2><span class="dot"></span>Waivers</h2>`;

  const tx = data.accepted_transactions || [];
  if(tx.length === 0){
    panel.innerHTML += `<p style="color:var(--chalk-dim);font-size:13px;">No waiver or free agent moves have cleared yet.</p>`;
    return panel;
  }

  const byEvent = {};
  tx.forEach(t => {
    const ev = t.event ?? 0;
    (byEvent[ev] = byEvent[ev] || []).push(t);
  });
  const eventKeys = Object.keys(byEvent).map(Number).sort((a,b) => a-b);

  function txRow(t){
    return `
      <div class="waiver-item" style="border-top:1px solid var(--line);">
        <span>
          <span class="waiver-kind-tag ${t.kind === 'Waiver' ? 'wa' : 'fa'}">${t.kind}</span>
          <b>${t.team_name}</b>${t.player_in ? ` picked up ${t.player_in}` : ''}${t.player_out ? `, dropped ${t.player_out}` : ''}
        </span>
      </div>
    `;
  }

  function renderGroup(ev){
    // Within a gameweek, waivers already come first (sorted worst-team-first
    // by fetch_data.py), with free agent pickups afterward - so no
    // re-sorting needed here, just render in the order provided.
    return byEvent[ev].map(txRow).join('');
  }

  const pillsWrap = document.createElement('div');
  pillsWrap.className = 'gw-pills';
  const contentWrap = document.createElement('div');

  const allPill = document.createElement('button');
  allPill.className = 'gw-pill active';
  allPill.textContent = 'All';
  allPill.addEventListener('click', () => {
    pillsWrap.querySelectorAll('.gw-pill').forEach(p => p.classList.remove('active'));
    allPill.classList.add('active');
    contentWrap.innerHTML = [...eventKeys].reverse().map(ev => `
      <div class="bracket-round-label">Gameweek ${ev}</div>
      ${renderGroup(ev)}
    `).join('');
  });
  pillsWrap.appendChild(allPill);

  eventKeys.forEach(ev => {
    const pill = document.createElement('button');
    pill.className = 'gw-pill';
    pill.textContent = 'GW ' + ev;
    pill.addEventListener('click', () => {
      pillsWrap.querySelectorAll('.gw-pill').forEach(p => p.classList.remove('active'));
      pill.classList.add('active');
      contentWrap.innerHTML = renderGroup(ev);
    });
    pillsWrap.appendChild(pill);
  });

  panel.appendChild(pillsWrap);
  panel.appendChild(contentWrap);
  allPill.click();

  return panel;
}

fetch(DATA_URL)
  .then(r => {
    if(!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  })
  .then(render)
  .catch(err => {
    document.getElementById('app').innerHTML = `
      <div class="state-msg">
        Couldn't load <code>${DATA_URL}</code> (${err.message}).<br/>
        If you're viewing this locally, serve the folder over HTTP rather than opening the file directly,
        or wait for the "Update league data" GitHub Action to run once on the live site.
      </div>`;
  });
</script>
