name: Update league data

on:
  schedule:
    # Every 2 hours, year round. FPL gameweeks mostly fall on weekends/midweek
    # evenings, so this keeps things reasonably fresh without hammering the API.
    - cron: "0 */2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      LEAGUE_ID: "6038"
      ENTRY_ID: "27110"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch latest league data
        run: python scripts/fetch_data.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/league.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update league data [skip ci]"
            git push
          fi
