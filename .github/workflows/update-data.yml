name: Update league data

on:
  schedule:
    # Every 10 minutes, year round. Note: GitHub's scheduled runs are
    # best-effort and can be delayed or skipped when their infrastructure is
    # busy, so treat this as "roughly every 10 minutes", not a guarantee.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  # Let an in-flight run finish rather than killing it just before it commits;
  # the timeout below stops it overrunning the next scheduled slot anyway.
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      LEAGUE_ID: "6038"
      ENTRY_ID: "27110"
      # Regular season GW1-35, playoffs: semis GW36, elimination GW37, final GW38.
      # Adjust if your league's schedule differs.
      REG_SEASON_END: "35"
      SEMI_GW: "36"
      ELIM_GW: "37"
      FINAL_GW: "38"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch latest league data
        run: python scripts/fetch_data.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/league.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update league data [skip ci]"
            git push
          fi
